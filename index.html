<style>
/* Một bảng màu sáng cố định theo tranh vẽ tay: giấy kem, mực đen, vàng bơ */
:root{
  --ink:#2A272C;--paper:#FBF8F2;--card:#FFFFFF;--muted:#7A7470;--line:#E6DED2;--accent:#FFD36B;--soft:#FFF1CC;
  --ok:#D7EFD9;--pink:#FFD6DD;--lilac:#E9DDFF;--gold:#FFE59A;
  --r1:#E9E4DC;--r2:#CFE8F7;--r3:#D9F0C8;--r4:#E6D4FF;--r5:#FFE08A;
  --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:var(--ink)}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;line-height:1.2}
h3{font-family:var(--display);font-weight:800;font-size:16px;margin:0;line-height:1.2}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* Phòng toàn màn hình */
.room{position:fixed;inset:0;z-index:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--paper)}
.room canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.room.editing canvas{touch-action:none;cursor:grab}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);z-index:5}
.bubble{position:absolute;z-index:15;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}
.bubble b{font-family:var(--display);font-size:15px}
.heart{position:absolute;z-index:16;pointer-events:none;width:22px;animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-50px) scale(1.3);opacity:0}}

/* HUD */
.hud{position:fixed;z-index:10;display:flex;align-items:center;gap:6px}
.top{top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.94);border:2px solid var(--ink);border-radius:18px;padding:4px 12px;display:flex;align-items:center;gap:12px;white-space:nowrap;min-height:42px}
.money{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.money b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.money svg{width:20px;height:20px;flex:0 0 auto}
.clock{font-size:13px;line-height:1.15;text-align:right;flex-direction:column;align-items:flex-end;gap:0;padding:3px 12px;border-radius:16px;flex:0 0 auto}
.clock b{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1}
.clock small{font-weight:600;color:var(--muted);font-size:11px;white-space:nowrap}
.rooms{top:calc(52px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));overflow-x:auto;padding:2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;border:2px solid var(--line);background:rgba(255,255,255,.92);border-radius:12px;padding:3px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;min-width:0}
.rchip b{font-size:12.5px;white-space:nowrap}
.rchip span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rchip.on{border-color:var(--ink);background:var(--soft)}
.rchip.out b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8BC48A;margin-right:4px;vertical-align:1px}
.rchip.add{border-style:dashed;background:rgba(251,248,242,.9)}
.rchip.add b{color:var(--muted)}
.notice{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top,0px));background:rgba(42,39,44,.88);color:#fff;border-radius:999px;padding:4px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;pointer-events:none;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.notice:empty{display:none}
.editbtn{position:fixed;z-index:10;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));font-weight:700;font-size:12.5px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer}
.editbtn.on{background:var(--accent)}
.edithint{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.dock{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(255,255,255,.94);border:2.5px solid var(--ink);border-radius:18px;padding:4px}
.dock button{position:relative;border:0;background:transparent;border-radius:13px;padding:4px 2px 3px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-family:var(--display);font-size:12px;line-height:1.1;min-width:0;white-space:nowrap}
.dock button svg{width:26px;height:26px}
.dock button.on{background:var(--accent)}
.dock button:active{transform:scale(.95)}
.dot{position:absolute;top:-2px;right:2px;min-width:20px;height:20px;border-radius:999px;background:#F26B6B;color:#fff;border:2px solid var(--ink);font-family:var(--body);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.dot:empty{display:none}

/* Khay */
.tray{position:fixed;z-index:20;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:min(64vh,600px);background:var(--card);border:2.5px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;transform:translateY(calc(100% + 140px));transition:transform .28s ease;box-shadow:0 8px 30px rgba(40,37,42,.25)}
.tray.open{transform:none}
.traytop{display:flex;gap:8px;align-items:center;padding:10px 10px 6px;border-bottom:2px solid var(--line)}
.traytop h2{flex:1}
.x{flex:0 0 auto;width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:var(--card);font-weight:800;font-size:18px;cursor:pointer;line-height:1}
.panels{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 16px}
.panel{display:flex;flex-direction:column;gap:12px}
.sub{display:flex;gap:4px;background:var(--paper);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.sub button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.box{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.box.hl{border-color:var(--ink);background:#FFF9EA}
.btn{font-weight:800;font-family:var(--display);font-size:17px;border:2.5px solid var(--ink);background:var(--accent);border-radius:14px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:0 3px 0 var(--muted);border-color:var(--muted)}
.btn.small{font-size:14px;padding:3px 10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.wide{width:100%}
.btn.confirm{background:#F7A9A9}
.why{font-size:12px;color:#B0503F;font-weight:600}
.bar{height:9px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper);min-width:50px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.mood i{background:#F7A1B4}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;border:1.5px solid var(--ink);background:var(--ok);white-space:nowrap;line-height:1.5}
.t1{background:var(--r1)}.t2{background:var(--r2)}.t3{background:var(--r3)}.t4{background:var(--r4)}.t5{background:var(--r5)}
.tag.shiny{background:linear-gradient(90deg,#FFD6E4,#D6F5FF,#FFF3B0)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ccard{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11.5px;line-height:1.25;text-align:center;cursor:pointer;min-height:122px;min-width:0}
.ccard img{max-width:76px;max-height:74px;width:auto;height:auto}
.ccard .nm{font-weight:700}
.ccard em{font-style:normal;font-size:10.5px;color:var(--muted)}
.ccard .bar{width:70%;height:7px;border-width:1.5px}
.ccard.sel{border-color:var(--ink);background:var(--soft)}
.ccard.away{opacity:.7}
.ccard.locked{background:var(--paper);border-style:dashed;cursor:default}
.ccard.locked img{filter:brightness(0) opacity(.18)}
.ccard .stars{position:absolute;top:3px;left:5px;font-size:11px;color:#E0A100;letter-spacing:-1px;font-weight:800}
.ccard .tierd{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.ccard.shinyc{box-shadow:inset 0 0 0 2px #FFE59A}
.qm{font-family:var(--display);font-weight:800;font-size:32px;color:var(--muted);line-height:74px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.li .ic{width:48px;height:48px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.li .ic img,.li .ic svg{max-width:48px;max-height:48px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;line-height:1.25}
.li .tx small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.li.off{background:var(--paper);border-style:dashed}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.mini{width:34px;height:34px;border-radius:8px;background:var(--paper);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:1.5px solid var(--line)}
.mini img{max-width:32px;max-height:32px}
.mini.empty{border-style:dashed}
.odds{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.odds th,.odds td{border-bottom:1.5px solid var(--line);padding:3px 4px;text-align:right}
.odds th:first-child,.odds td:first-child{text-align:left}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sitem{border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card)}
.sitem.placed{border-color:#9CCB9F;background:#F6FBF6}
.sitem .th{height:70px;display:flex;align-items:flex-end;justify-content:center}
.sitem .th img{max-height:70px;max-width:104px}
.sitem .th svg,.li .ic svg{width:60px;height:60px}
.li .ic svg{width:46px;height:46px}
.sitem .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.sitem .nm small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.meter{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.meter i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;top:calc(136px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:7px 16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}

/* Bảng con mèo và lớp phủ */
.veil{position:fixed;inset:0;z-index:40;background:rgba(42,39,44,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.veil[hidden]{display:none!important}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .hero{display:flex;gap:12px;align-items:flex-end}
.sheet .hero img{max-width:120px;max-height:130px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.stage{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 40%,#FFF6DE,#F3E6CC);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.stage[hidden]{display:none!important}
.stage h2{font-size:24px;text-align:center}
.cards{display:flex;gap:10px;justify-content:center;perspective:900px;flex-wrap:nowrap}
.card{width:min(29vw,150px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.up{transform:rotateY(180deg)}
.card>div{position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 4px;gap:2px;overflow:hidden}
.card .back{background:#FFD36B repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.35) 10px 20px);justify-content:center}
.card .back svg{width:60%}
.card .back.lucky{background:#F7B6C8 repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.4) 10px 20px);box-shadow:0 0 0 3px #fff,0 0 22px #FFB3D0}
.card .front{transform:rotateY(180deg);background:var(--card)}
.card .front img{max-width:92%;max-height:62%;margin-bottom:auto;margin-top:12%}
.card .front b{font-size:12px;line-height:1.2;text-align:center}
.card .front.t1{background:#F7F4EF}.card .front.t2{background:#E8F4FB}.card .front.t3{background:#EEF8E6}.card .front.t4{background:#F2EAFF}.card .front.t5{background:#FFF3C4}
.card .front.t4,.card .front.t5{box-shadow:inset 0 0 0 3px #fff}
.card .front.sh::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 45%,transparent 60%);animation:shine 1.6s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.card .nw{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;background:#F26B6B;color:#fff;border-radius:99px;padding:0 6px}
.bigbox{width:min(56vw,240px);cursor:pointer;animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bigbox.tear{animation:tear .5s forwards}
@keyframes tear{to{transform:scale(1.3);opacity:0}}
.egg{width:64px;height:78px;flex:0 0 auto;cursor:pointer}
.egg.wig{animation:wig 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.spa{position:relative;width:min(80vw,320px);height:min(80vw,320px)}
.spa img{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:60%;max-height:60%}
.spa .tub{position:absolute;left:0;right:0;bottom:0;height:34%;background:#CFE8F7;border:2.5px solid var(--ink);border-radius:20px 20px 40px 40px}
.spa .bub{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#E4F3FF 60%,#BFE0F7);border:2px solid var(--ink);cursor:pointer;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}

/* Hàng việc cần làm: icon, tên, một dòng trạng thái, một nút */
.task{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card);min-height:60px}
.task.hl{border-color:var(--ink);background:#FFF9EA}
.task .ic,.li .ic{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.task .ic img,.task .ic svg,.li .ic img,.li .ic svg{max-width:40px;max-height:40px;width:auto;height:auto}
.task .ic svg,.li .ic svg{width:38px;height:38px}
.task .ic.big{width:56px;height:56px}.task .ic.big img{max-width:56px;max-height:56px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14.5px;line-height:1.25}
.task .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.warn{color:#B0503F;font-weight:700}
.seg{display:flex;gap:4px;margin-top:-4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:32px}
.seg button.on{border-color:var(--ink);background:var(--soft);color:var(--ink)}
.panel{gap:8px}
.li{padding:6px 8px;gap:8px}
.li .tx b{font-size:14px}
.li.on{border-color:#9CCB9F;background:#F6FBF6}
.li .btn.small{padding:3px 9px;font-size:13.5px}

function makeSky(im){const W=256,Hh=384,c=mk(W,Hh),x=c.getContext('2d');x.drawImage(im,0,0,W,Hh);const d=x.getImageData(0,0,W,Hh).data;

  const fill=(len,step,cnt,stride)=>{for(let l=0;l<cnt;l++){let last=-1;for(let k=0;k<len;k++){const i=l*stride+k*step;if(sky[i]){if(last>=0&&k-last>1&&k-last<70){let ok=true;for(let j=last+1;j<k;j++)if(!bright[l*stride+j*step]){ok=false;break}if(ok)for(let j=last+1;j<k;j++)sky[l*stride+j*step]=2}last=k}}}};

function patternMask(g,b){
  const U=b.K/0.55;const W=b.W,H2=b.ch,c=mk(W,H2),x=c.getContext('2d');const r=rng(hash(keyOf(g)));

  const spots=[],F=[rf[0]-3*U,rf[1]-3*U,rf[2]+3*U,rf[3]+5*U];
  const near=(cx,cy,rad)=>{const dx=Math.max(F[0]-cx,0,cx-F[2]),dy=Math.max(F[1]-cy,0,cy-F[3]);return Math.hypot(dx,dy)<rad+3*U};
  if(g.pattern==='spots'){let n=0,t=0;const big=Math.min(bw0,bh0);
    while(n<Math.min(6,3+Math.floor(bw0*bh0/(2600*U*U)))&&t<90){t++;const rad=Math.min(13*U,big*(.1+.08*r()));const cx=rb[0]+rad+r()*(bw0-2*rad),cy=rb[1]+rad+r()*(bh0-2*rad);if(near(cx,cy,rad))continue;spots.push([(cx-rb[0])/bw0,(cy-rb[1])/bh0,rad/big]);n++}}

  b.fr.forEach((fr,i)=>{const ox=i*b.cw;const [x0,y0,x1,y1]=fr.bb,bw=x1-x0,bh=y1-y0,mn=Math.min(bw,bh);const f=fr.face;const fcx=(f[0]+f[2])/2;

    else if(g.pattern==='calico'){const left=fcx<(x0+x1)/2;blob(left?x1-mn*.2:x0+mn*.2,y0+bh*.42,mn*.3,'rgb(255,0,0)',seeds[0]);blob(left?x0+bw*.3:x1-bw*.3,y1-mn*.14,mn*.25,'rgb(0,255,0)',seeds[1])}
    else if(g.pattern==='stripes'){x.fillStyle=x.strokeStyle='rgb(0,0,255)';
      if(bh>bw*1.5){const top=f[3]+6*U;for(let yy=y1-16*U;yy>top;yy-=16*U){x.beginPath();for(let k=0;k<=12;k++)x.lineTo(x0-3+k*(bw+6)/12,yy+Math.sin(k*.7)*1.2*U);for(let k=12;k>=0;k--)x.lineTo(x0-3+k*(bw+6)/12,yy+5.5*U+Math.sin(k*.7)*1.2*U);x.fill()}}
      else{x.lineCap='round';x.lineWidth=5.5*U;const left=fcx<(x0+x1)/2;const xs=left?f[2]+8*U:x0+6*U,xe=left?x1-4*U:f[0]-8*U;
        if(xe-xs<18*U){for(let xx=x0+7*U;xx<x1-4*U;xx+=14*U){if(xx>f[0]-5*U&&xx<f[2]+5*U)continue;x.beginPath();x.moveTo(xx,f[3]+3*U);x.quadraticCurveTo(xx-2*U,f[3]+bh*.3,xx+U,f[3]+bh*.45);x.stroke()}}

const CACHE=new Map();
function compose(g){
  const k=keyOf(g);if(CACHE.has(k))return CACHE.get(k);
  if(isW(g.shape)){const res={atlas:BASE[g.shape].atlas,url:null};CACHE.set(k,res);return res}
  const b=BASE[g.shape],W=b.W,H2=b.ch,s=b.data,pm=patternMask(g,b),pr=b.prop;
  const C=COL[g.color],P=PAT1[g.color],T=STR[g.color],black=g.color==='black',FE=black?[245,242,238]:INK;
  const cv=mk(W,H2),cx=cv.getContext('2d'),im=cx.createImageData(W,H2),o=im.data;
  for(let i=0;i<o.length;i+=4){const A=s[i+3];if(!A)continue;
    const Rr=s[i]/255,G=s[i+1]/255,sh=s[i+2]/255,isP=pr&&pr[i+3]>128;const p1=pm[i]/255,p2=pm[i+1]/255,p3=pm[i+2]/255;
    for(let ch=0;ch<3;ch++){let v;
      if(isP)v=pr[i+ch];else{v=C[ch];v=v*(1-p1)+P[ch]*p1;v=v*(1-p2)+ORANGE[ch]*p2;v=v*(1-p3)+T[ch]*p3;v=black?v*(.9+.1*sh)+(sh>.985?6:0):v*sh}
      v=v*(1-Rr)+INK[ch]*Rr;v=v*(1-G)+(isP?INK[ch]:FE[ch])*G;o[i+ch]=v}
    o[i+3]=A}
  cx.putImageData(im,0,0);const res={atlas:cv,url:null};CACHE.set(k,res);return res;
}

function migrate(o){// bản demo cũ: giữ cá, mèo, phòng đã mở và đồ đạc
  fresh();st.cats=[];st.fish=Math.round(o.fish||0);st.xu=400;
  const opened=(o.open||[]).map((v,i)=>v?i:-1).filter(i=>i>=0);if(!opened.length)opened.push(0);
  let tpl=TPL.findIndex(t=>t.rooms>=opened.length);if(tpl<0)tpl=TPL.length-1;
  const h=st.houses[0];h.tpl=tpl;h.lot.area=TPL[tpl].min;h.rooms=opened.map(i=>{const r=newRoom(i);r.furn=(o.furn&&o.furn[i])||{};r.owned=(o.owned&&o.owned[i])||Object.keys(r.furn);return r});syncOutdoor(h);
  (o.cats||[]).forEach(oc=>{if(!SPR[oc.g.shape])return;const c=mkCat({...oc.g});const ri=h.rooms.findIndex(r=>r.t===oc.room);c.h=h.id;c.r=ri>=0?ri:0;st.cats.push(c);see(c.g)});
  rebalance();

  if(!st.toiletInit){st.toiletInit=1;const h=st.houses[0];if(h&&!boxesOf(h).length){const r=h.rooms[0];r.furn.t_tray={x:300,y:ROOMT[r.t].fl+150,dirt:0,lit:'clay'};r.owned.push('t_tray')}}}

function moodGain(c,f,extra=0){const F=FD[f];let m=F.mood*(c.last===f&&F.k==='meal'?.5:1)+extra;if(c.mood>=F.cap)return 0;return Math.max(0,Math.min(F.cap,c.mood+m)-c.mood)}
function eat(c,f){if(FD[f].k==='meal')c.last=f;c.full=Math.min(now()+30*H,Math.max(now(),c.full||0)+(FD[f].full||0)*H);c.fed=dayKey(gnow())}
function toyHours(h,ri){const seen=new Set();let x=0;for(const k in h.rooms[ri].furn){const f=fid(k);if(f&&f.toy&&!seen.has(f.id)){seen.add(f.id);x+=f.hrs}}return Math.min(18,x)}

function gadOf(h){const g={mood:0,grace:0,dirt:1,clean:0,robot:0},seen=new Set();
  h.rooms.forEach((r,ri)=>{for(const k in r.furn){const f=fid(k);if(!f||seen.has(f.id))continue;
    if(f.gad){seen.add(f.id);const e=f.gad;g.mood+=e.mood||0;g.grace+=e.grace||0;g.dirt*=e.dirt||1;g.clean|=e.clean||0;g.robot|=e.robot||0}}});
  return g}
function feedersOf(h){const out=[];h.rooms.forEach(r=>{for(const k in r.furn){const f=fid(k);if(f&&f.feeder)out.push(f)}});return out}
function capOf(h){return boxesOf(h).reduce((a,b)=>a+b.f.cap,0)}
function houseDirt(h){const bx=boxesOf(h),n=usersOf(h);if(!n)return 0;if(!bx.length)return 100;const cap=capOf(h);return bx.reduce((a,b)=>a+(b.p.dirt||0)*b.f.cap,0)/cap}
function accrue(hours){if(hours<=0)return;st.houses.forEach(h=>{const n=usersOf(h),bx=boxesOf(h);if(!n||!bx.length)return;const load=n/capOf(h);
  const gm=gadOf(h).dirt;bx.forEach(b=>{b.p.dirt=Math.min(100,(b.p.dirt||0)+hours/24*22*load*b.f.rate*gm*(LT[b.p.lit||'clay']||LT.clay).rate)})})}
function takeLitter(){if(st.litter[st.litterUse]>0)return st.litterUse;return LITTERS.map(l=>l.id).find(k=>st.litter[k]>0)||null}

  st.litter[k]--;b.p.dirt=0;b.p.lit=k;const m=LT[k].mood;if(m)st.cats.forEach(c=>{if(c.h===h.id)c.mood=Math.min(100,c.mood+m)});return true}
function cleanAll(){let n=0,miss=0;st.houses.forEach(h=>boxesOf(h).forEach(b=>{if((b.p.dirt||0)<3)return;if(cleanBox(h,b,true))n++;else miss++}));
  save();toast(n?`Đã dọn ${n} khay${miss?`, còn ${miss} khay chưa dọn vì hết cát`:''}`:miss?'Hết cát mèo rồi. Mua ở Mua sắm, mục Vệ sinh':'Khay nào cũng sạch');render()}

const moodF=c=>.6+.6*c.mood/100;

function wageOf(c,j,withMood=true){const t=tierOf(c.g);return TIERS[t].base*9*j.m*(fits(c,j)?1.35:1)*(withMood?moodF(c):1)*starF(c)*furOf(c.g)*(1+(c.fb||0))*(c.spa>gnow()?1.15:1)}
const HOME=[60,96,168,300,540];// cá mỗi giờ ngoài đời khi mèo ở nhà, bằng 1/3 lúc đi làm
const homeRate=c=>{const h=houseById(c.h);if(!h)return 0;return HOME[tierOf(c.g)]*starF(c)*moodF(c)*(1+.1*comfort(h.rooms[c.r]))*fishBonus(h)};
// xu tự ra: mỗi nhà đang ở 6 xu mỗi giờ, cộng thêm theo độ êm của đồ đạc
function xuPerHour(){return st.houses.filter(h=>!h.rent).reduce((a,h)=>a+20+.8*h.rooms.reduce((b,r)=>b+comfort(r),0)+1.5*st.cats.filter(c=>c.h===h.id).length,0)}
function passivePerHour(t=now()){return st.cats.reduce((a,c)=>a+(c.h>=0&&present(c,t)&&!c.sick?homeRate(c):0),0)}

// ---------- Xử lý thời gian ----------
function nextBoundary(t){const c=[at(t,7),at(t,17),at(t,19),at(t+DAY,7)].filter(b=>b>t);return Math.min(...c)}
function process(){
  const T=now();let t=st.t||T;if(T-t>30*DAY)t=T-30*DAY;
  // cá tự ra lúc tắt game: 40%, tối đa 12 giờ
  const gap=T-(st.last||T);if(gap>2*MIN){const hrs=Math.min(12,gap/H);const got=passivePerHour(st.last)*hrs*.4;if(got>=1){st.fish+=got;st.offline=(st.offline||0)+got}const gx=xuPerHour()*hrs*.4;st.xu+=gx;st.offXu=(st.offXu||0)+gx}
  const gT=G(T);let gp=Math.max(G(t),Math.min(gT,st.gt||G(t)));
  for(let b=nextBoundary(G(t));b<=gT;b=nextBoundary(b)){
    if(b>gp){accrue((b-gp)/H);gp=b}
    const hh=new Date(b).getHours();
    if(hh===7)morning(b);else if(hh===17&&isWeekday(b))payday(b);else if(hh===19)robotClean()}
  if(gT>gp)accrue((gT-gp)/H);st.gt=gT;
  st.cats.forEach(c=>{if(c.hosp&&gT>=c.hosp){c.hosp=0;c.sick=0;c.mood=Math.max(c.mood,60);st.healed=(st.healed||0)+1}});
  const rd=dayKey(T);if(st.rday!==rd){if(st.rday)payRent();st.rday=rd}
  st.t=T;feederTick();toyWear();awayTick();
  while(st.free<2&&st.freeAt&&T>=st.freeAt){st.free++;st.freeAt=st.free<2?st.freeAt+12*H:0}
  strays(T);
}
const FUSSY=[6,7,8,10,12];// mèo càng hiếm càng khó chiều: mỗi sáng tụt tâm trạng nhiều hơn
function morning(b){const slept=!lightOn();st.cats.forEach(c=>{c.mood=Math.max(0,Math.min(100,c.mood-FUSSY[tierOf(c.g)]-(c.sick?8:0)+(slept?5:0)))});
  st.houses.forEach(h=>{const g=gadOf(h);boxesOf(h).forEach(bx=>{if((bx.f.auto&&(bx.p.dirt||0)>5)||(g.robot&&(bx.p.dirt||0)>=20))cleanBox(h,bx,true)});
    const d=houseDirt(h),n=usersOf(h),over=n>capOf(h);const lg=boxesOf(h).reduce((a,x)=>Math.max(a,(LT[x.p.lit||'clay']||LT.clay).grace||0),0),ds=d-g.grace-lg;let p=ds>=90?.25:ds>=70?.1:ds>=55?.03:0;if(over&&n)p+=.08;
    
    st.cats.forEach(c=>{if(c.h!==h.id||c.sick||c.hosp)return;if(d>=70&&!g.clean)c.mood=Math.max(0,c.mood-6);
      if(g.mood)c.mood=Math.min(100,c.mood+g.mood);const rt=realOf(b);if(!((c.full||0)>rt))c.mood=Math.max(0,c.mood-8);if(rt-(c.joy||0)>boredAfter(c)*H)c.mood=Math.max(0,c.mood-6);
      if(R()<p&&now()-(st.startAt||0)>3*DAY){c.sick=b;st.newSick=(st.newSick||0)+1}})});
  neglect(b)}

// Điểm danh mỗi ngày (ngày mới lúc 7 giờ sáng ngoài đời). Bỏ một ngày là về lại ngày 1.
const STREAK=[{fish:100},{fish:200},{xu:30},{fish:300},{xu:60},{fish:500},{xu:100,tickets:1}];
const streakTxt=r=>[r.fish&&`${fmt(r.fish)} cá`,r.xu&&`${r.xu} xu`,r.tickets&&`${r.tickets} vé hộp`].filter(Boolean).join(' + ');
function streakState(){const td=dayKey(now()),yd=dayKey(now()-DAY),s0=st.streak||{d:'',n:0};const done=s0.d===td;const n=done?s0.n:(s0.d===yd?s0.n+1:1);return{done,n,r:STREAK[(n-1)%7]}}
function claimStreak(){const x=streakState();if(x.done)return;st.streak={d:dayKey(now()),n:x.n};const r=x.r;st.fish+=r.fish||0;st.xu+=r.xu||0;st.tickets+=r.tickets||0;save();toast(`Điểm danh ngày ${x.n}: +${streakTxt(r)}`);renderHud();render()}

// ===== Mở dần tính năng: Ấp trứng, Đi làm, Chợ cá, Nhà đất mở khi có 3 mèo =====
const unlocked=()=>!!st.unlockAll||st.cats.length>=3;
function checkUnlock(){if(!st.unlockAll&&st.cats.length>=3){st.unlockAll=1;save();toast('Đã mở thêm: Ấp trứng, Đi làm, Chợ cá, Nhà đất',4000);logEv('Mở thêm Ấp trứng, Đi làm, Chợ cá, Nhà đất')}
  const eb=document.querySelector('.dock button[data-p="egg"]');if(eb)eb.hidden=!unlocked()}
function logEv(txt){(st.events=st.events||[]).unshift({t:Date.now(),txt});if(st.events.length>40)st.events.length=40}
const RUN_DAYS=8,WARN_DAYS=4;// ngày trong game: 6 ngày game = 1 ngày thật, nên bỏ bê khoảng 1,5 ngày thật mới đi
const realOf=b=>GE+(b-GE)/SPEED;
function neglectWhy(c,b){const h=houseById(c.h),why=[],rt=realOf(b);if(!h)return why;
  if(!((c.full||0)>rt))why.push('đói');if(rt-(c.joy||0)>boredAfter(c)*H)why.push('chán');if(c.mood<25)why.push('buồn');if(houseDirt(h)>=80)why.push('khay bẩn');return why}
function neglect(b){
  st.cats.forEach(c=>{if(c.h<0||c.hosp)return;const why=neglectWhy(c,b),h=houseById(c.h);const bad=c.mood<25||(h&&houseDirt(h)>=90);c.neg=bad?(c.neg||0)+1:Math.max(0,(c.neg||0)-2);c.why=why.length?why:['buồn']})
  if(st.cats.length<=3)return;// nhà ít mèo thì không con nào bỏ đi
  const cand=st.cats.filter(c=>c.h>=0&&!c.hosp&&(c.neg||0)>=RUN_DAYS).sort((a,b2)=>b2.neg-a.neg)[0];
  if(cand){st.cats=st.cats.filter(c=>c!==cand);actors.delete(cand.id);const why=cand.why.join(', ');
    (st.away=st.away||[]).push({c:cand,why,until:now()+2*DAY});logEv(`${nameOf(cand.g)} giận dỗi ra hiên ngồi vì ${why}. Dỗ bằng món khoái khẩu trong 2 ngày để mèo về`)}}

// Lớp màu trời: multiply để tối thật, kèm quầng đèn ấm khi về đêm
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
function skyLevels(h){// trả về [độ đêm 0-1, độ chiều vàng 0-1, độ bình minh 0-1]
  if(h>=21||h<4.5)return[1,0,0];

const toRoom=e=>{const rc=cv.getBoundingClientRect();return[(e.clientX-rc.left+OX)/S,(e.clientY-rc.top+OY)/S]};
cv.addEventListener('pointerdown',e=>{if(!edit)return;const [px,py]=toRoom(e);const F=curRoom().furn;
  const ids=Object.keys(F).sort((a,b)=>furnBox(b,F[b]).z-furnBox(a,F[a]).z);
  const id=ids.find(id=>{const b=furnBox(id,F[id]);return px>=b.x0&&px<=b.x1&&py>=b.y0&&py<=b.y1});
  if(id){drag={id,dx:px-F[id].x,dy:py-F[id].y,sx:e.clientX,sy:e.clientY,moved:false};editSel=id;updEditBar();cv.setPointerCapture(e.pointerId);e.preventDefault()}else{editSel=null;updEditBar()}});
cv.addEventListener('pointermove',e=>{if(!drag)return;if(!drag.moved&&Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;drag.moved=true;const [px,py]=toRoom(e);const f=fid(drag.id),h=f.h||f.w,fl=ROOMT[curT()].fl;const p=curRoom().furn[drag.id];
  p.x=Math.max(VX0+f.w/2-20,Math.min(VX1-f.w/2+20,px-drag.dx));
  p.y=f.wall?Math.max(VY0+70,Math.min(fl-h-6,py-drag.dy)):Math.max(fl+24,Math.min(FEET[1]+40,py-drag.dy))});
const endDrag=()=>{if(drag){drag=null;save()}};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
function clampRoom(){const F=curRoom().furn;for(const k in F)if(fid(k))clampFurn(k,F[k])}
function clampFurn(id,p){const f=fid(id),h=f.h||f.w*1.2,fl=ROOMT[curT()].fl;p.x=Math.max(VX0+f.w/2,Math.min(VX1-f.w/2,p.x));p.y=f.wall?Math.max(VY0+70,Math.min(fl-h-6,p.y)):Math.max(fl+24,Math.min(FEET[1]+40,p.y))}
const floorY=f=>ROOMT[curT()].fl+f.y;

  if(ROOMT[curT()].out){const b=bowlPos();if(Math.abs(px-b.x)<75&&py>b.y-70&&py<b.y+18){openBowl();return}}
  {const F=curRoom().furn;const tid=Object.keys(F).find(id=>{if(!fid(id)||!fid(id).toilet)return false;const b=furnBox(id,F[id]);return px>=b.x0&&px<=b.x1&&py>=b.y0-30&&py<=b.y1});
    if(tid){const h=curHouse(),bx=boxesOf(h).find(b=>b.p===F[tid]);if((F[tid].dirt||0)<3){toast(`${fid(tid).name} đang sạch. Dùng được cho ${fid(tid).cap} mèo`);return}
      if(cleanBox(h,bx)){save();toast(`Đã dọn ${fid(tid).name.toLowerCase()}, dùng 1 lần ${LT[F[tid].lit].n.toLowerCase()}`);renderHud();if(trayP)render()}return}}
  const hit=hitCat(px,py);
  if(hit)hit.stray?tapStray(hit):tapCat(hit)});
function hitCat(px,py){return [...actors.values()].sort((p,q)=>q.Y-p.Y).find(a=>{const b=a.b,k=depth(a),bb=b.fr[8].bb,s=k*CS/b.K,lift=b.fly?36*CS:0;
    const x0=a.X+(bb[0]-b.cw/2)*s,x1=a.X+(bb[2]-b.cw/2)*s,y0=a.Y-lift+(bb[1]-b.foot)*s-8,y1=a.Y-lift+8;return px>x0&&px<x1&&py>y0&&py<y1})}
let bubble=null;
function say(a,html,ms=1800){const b=a.b,k=depth(a);const cx=a.X*S-OX,top=(a.Y-(b.foot-b.fr[8].bb[1])*k*CS/b.K-(b.fly?36*CS:0))*S-OY;
  if(bubble)bubble.remove();const bb=document.createElement('div');bb.className='bubble';bb.innerHTML=html;
  bb.style.left=Math.min(Math.max(cx,90),room.clientWidth-90)+'px';bb.style.top=Math.max(top-22,120)+'px';room.appendChild(bb);bubble=bb;setTimeout(()=>{if(bubble===bb){bb.remove();bubble=null}},ms);return[cx,top]}
function heart(cx,top){const ht=document.createElement('div');ht.className='heart';ht.style.left=(cx-11)+'px';ht.style.top=top+'px';
  ht.innerHTML='<svg viewBox="0 0 24 22"><path d="M12 20C4 14 1 10 1 6a5 5 0 0 1 11-2 5 5 0 0 1 11 2c0 4-3 8-11 14Z" fill="#F7849A" stroke="#2A272C" stroke-width="2"/></svg>';
  room.appendChild(ht);setTimeout(()=>ht.remove(),1000)}
function tapCat(a){const c=a.c,dk=dayKey(gnow());c.joy=now();guideHit('pet');if(c.petDay!==dk){c.petDay=dk;c.pets=0}
  a.jump=1;a.state='idle';a.t=1.6;
  if(c.pets<3){c.pets++;c.mood=Math.min(100,c.mood+10);a.expr=11;a.exprT=1.3;const [x,y]=say(a,`<b>${esc(shortName(c.g))}</b> · tâm trạng ${c.mood}`);heart(x,y);save();

  confirmMap.set(key,1);btn.classList.add('confirm');btn.textContent=label||'Bấm lần nữa';setTimeout(()=>{confirmMap.delete(key);if(btn.isConnected){btn.classList.remove('confirm');render()}},3000)}

const short=n=>{n=Math.floor(n);if(n<10000)return fmt(n);if(n<1e6)return (n/1e3).toLocaleString('vi-VN',{maximumFractionDigits:n<1e5?1:0})+'K';return (n/1e6).toLocaleString('vi-VN',{maximumFractionDigits:1})+'Tr'};
function updateWallet(){$('fish').textContent=short(st.fish);$('xu').textContent=short(st.xu);const bx=boost(),fr=passivePerHour()*bx,xr=xuPerHour()*bx;$('fishrate').textContent=fr?'+'+fmt(fr)+'/giờ'+(bx>1?' ×2':''):'';$('xurate').textContent='+'+(xr<10?xr.toLocaleString('vi-VN',{maximumFractionDigits:1}):fmt(xr))+'/giờ'+(bx>1?' ×2':'')}

function clockText(){const T=now(),g=new Date(G(T)),W=['CN','T2','T3','T4','T5','T6','T7'];
  const nWork=st.cats.filter(c=>away(c,T)).length,night=isNight(G(T));
  const sub=nWork?`${nWork} mèo đang đi làm`:night?(lightOn()?'Đêm · đèn đang bật':'Đêm · mèo ngủ'):isWeekend(G(T))?'Ngày nghỉ':'Mèo ở nhà chơi';
  return `<b>${W[g.getDay()]} ${g.getHours()}:${String(g.getMinutes()).padStart(2,'0')}</b><small>${sub}</small>`}
// Lần trả lương tới (giờ thật còn lại)
const backIn=()=>{const g=G(now());return Math.max(0,(at(g,17)-g)/SPEED)};
function nextPayIn(){let g=G(now());for(let i=0;i<9;i++){const c=at(g+i*DAY,17);if(c>g&&isWeekday(c))return (c-g)/SPEED}return 0}
function nextWeekendIn(){let g=G(now());for(let i=0;i<9*24;i++){const t=g+i*H;if(isWeekend(t))return (t-g)/SPEED}return 0}
function notices(){const n=[];const sk=sickCats().length;if(sk)n.push(`${sk} mèo bị ốm, cần đưa đi bệnh viện`);const md=maxDirt();if(md>=55)n.push(md>=75?'Khay vệ sinh bẩn lắm rồi, dọn ngay kẻo mèo ốm':'Khay vệ sinh hơi bẩn, chạm vào khay để dọn');
  if(st.cats.length&&!st.houses.some(h=>boxesOf(h).length))n.push('Nhà chưa có khay vệ sinh');if(readyShards().length)n.unshift('Đủ lá ghép mèo rồi, vào Hộp mèo để ghép');else if(!st.cats.length)n.push('Nhà chưa có mèo. Mở Hộp mèo lấy lá, đủ lá thì ghép ra mèo');if(st.mail>0)n.push(`Hòm thư có ${fmt(st.mail)} cá lương`);
  const ready=st.eggs.filter(e=>now()>=e.end).length;if(ready)n.push(`${ready} trứng đã nở`);

// Mở ra chỉ là lá. Gom đủ lá cùng loài mới ghép ra mèo.
const NEED=[3,5,8,16,32];// càng hiếm càng cần nhiều lá
const needOf=sh=>NEED[TIER_OF[sh]];
const shardsOf=sh=>(st.shards||{})[sh]||0;
const known=sh=>shardsOf(sh)>0||(st.species||[]).includes(sh)||(st.shardSeen||[]).includes(sh);
const readyShards=()=>ALLSH.filter(sh=>shardsOf(sh)>=needOf(sh));
// Hình đại diện: màu lông đã có gần nhất, chưa có thì mèo trắng trơn (không lộ màu chưa mở)
const plainG=sh=>{const vs=(st.seen||[]).filter(k=>k.split('|')[0]===sh);if(!vs.length)return{shape:sh,pattern:'plain',color:'white'};const [,pt,co]=vs[vs.length-1].split('|');
  return isW(sh)?{shape:sh,pattern:'plain',color:'white',...(pt==='shiny'?{shiny:1}:{})}:{shape:sh,pattern:pt,color:co}};
function renderBox(){const P=$('p-box'),T=now();if(st.buyDay!==dayKey(T)){st.buyDay=dayKey(T);st.buyN=0}
  if(!st.shards)st.shards={};
  const waitFull=waiting().length>=10;const p=buyPrice();const ready=readyShards();
  const owned=ALLSH.slice().sort((a,b)=>(shardsOf(b)/needOf(b))-(shardsOf(a)/needOf(a))||TIER_OF[b]-TIER_OF[a]);
  P.innerHTML=`
  ${ready.length?`<div class="box hl"><div class="row"><h3>Ghép được ${ready.length} mèo</h3>${ready.length>1?`<button type="button" class="btn small" id="mergeall"${waitFull?' disabled':''}>Ghép hết</button>`:''}</div>
    <div class="list">${ready.map(sh=>`<div class="li"><div class="ic">${imgTag(plainG(sh))}</div><div class="tx"><b>${esc(SPR[sh].name)}</b><small>${tierTag(TIER_OF[sh])} ${shardsOf(sh)}/${needOf(sh)} lá</small></div><button type="button" class="btn small" data-merge="${sh}"${waitFull?' disabled':''}>Ghép</button></div>`).join('')}</div>
    ${waitFull?'<p class="why">Phòng chờ đầy 10 con. Bán bớt mèo hoặc xây thêm phòng rồi ghép tiếp.</p>':''}</div>`:''}
  <div class="box${ready.length?'':' hl'}">
    <div class="row"><h3>Lượt miễn phí ${st.free}/2</h3><span class="hint">${st.free<2?'Lượt mới sau '+dur(st.freeAt-T):'Đầy lượt, mở đi kẻo phí'}</span></div>
    <p class="hint">Úp 3 lá, chọn 2. Gom đủ lá cùng loài thì ghép ra một bé mèo. Mèo càng hiếm càng cần nhiều lá.</p>
    <button type="button" class="btn wide" id="openfree"${st.free<1?' disabled':''}>Mở lượt miễn phí</button>
    ${st.tickets?`<button type="button" class="btn ghost wide" id="openticket">Dùng vé (còn ${st.tickets})</button>`:''}
  </div>
  <div class="task"><div class="tx"><b>Mua thêm lượt</b><small>Hôm nay ${st.buyN}/3 lượt</small></div><button type="button" class="btn small" id="buybox"${!p||st.fish<p?' disabled':''}>${p?M(p,'cá'):'Hết lượt'}</button></div>
  <div class="task"><div class="tx"><b>Điểm Hộp: ${fmt(st.pts)}</b><small>Mỗi lượt +5. Đổi thẳng ra mèo từ 100 điểm</small></div><button type="button" class="btn small ghost" id="exch">Đổi</button></div>
  <details class="more" open><summary>Lá mèo (${ALLSH.filter(sh=>known(sh)).length}/${ALLSH.length} loài đã thấy)</summary>
    <p class="hint">Loài chưa gặp chỉ hiện bóng. Có lá đầu tiên là hiện ra.</p>
    ${TIERS.map((t,ti)=>`<div class="row tierhead"><span>${tierTag(ti)}</span><span class="hint">${NEED[ti]} lá ghép 1 con</span></div><div class="grid">${BY_TIER[ti].slice().sort((a,b)=>(shardsOf(b)/needOf(b))-(shardsOf(a)/needOf(a))||known(b)-known(a)).map(sh=>{const n=shardsOf(sh),k=needOf(sh),kn=known(sh);
      return `<div class="ccard${n>=k?' sel':''}${kn?'':' locked'}">${kn?imgTag(plainG(sh)):silTag(plainG(sh))}<span class="nm">${kn?esc(SPR[sh].name):'???'}</span><span class="bar"><i style="width:${Math.min(100,n/k*100)}%"></i></span><em>${n}/${k} lá</em></div>`}).join('')}</div>`).join('')}</details>
  <details class="more"><summary>Tỉ lệ ra lá</summary>
    <table class="odds"><thead><tr><th>Bậc</th><th>Lá thường</th><th>Lá may mắn</th><th>Cần</th></tr></thead><tbody>
    ${TIERS.map((t,i)=>`<tr><td>${tierTag(i)} ${BY_TIER[i].length} con</td><td>${ODDS[0][i]}%</td><td>${ODDS[1][i]}%</td><td>${NEED[i]} lá</td></tr>`).join('')}</tbody></table>
    <p class="hint">Lúc ghép mới ra kiểu lông: trơn 70%, hoa văn 25% (lương +10%), lấp lánh 5% (lương +25%, bán gấp 3).</p></details>`;
  $('openfree').onclick=()=>{if(st.free<1)return;st.free--;if(!st.freeAt)st.freeAt=now()+12*H;openBox()};
  if($('openticket'))$('openticket').onclick=()=>{st.tickets--;openBox()};
  $('buybox').onclick=e=>{const p=buyPrice();if(!p||st.fish<p)return;twoTap(e.currentTarget,'buybox',`Trả ${fmt(p)} cá?`,()=>{st.fish-=p;st.buyN++;openBox()})};
  $('exch').onclick=openExchange;
  bind(P,'[data-merge]',el=>merge(el.dataset.merge));
  if($('mergeall'))$('mergeall').onclick=()=>{const l=readyShards();const made=[];l.forEach(sh=>{while(shardsOf(sh)>=needOf(sh)&&waiting().length<10)made.push(mergeOne(sh))});save();showMerged(made)}}
function mergeOne(sh){st.shards[sh]-=needOf(sh);const g=rollFur(sh);const isNew=see(g);const c=mkCat(g);home(c);st.cats.push(c);return{c,isNew}}
function merge(sh){if(shardsOf(sh)<needOf(sh))return;const r=mergeOne(sh);save();showMerged([r])}
function showMerged(list){if(!list.length)return;const S2=$('stage');S2.hidden=false;
  S2.innerHTML=`<h2>${list.length>1?'Ghép xong '+list.length+' mèo!':list[0].isNew==='species'?'Loài mới!':'Ghép xong!'}</h2><div class="cards" style="flex-wrap:wrap">${list.map(r=>`<div class="card up"><div class="back">${PAW}</div>${cardFront(r.c.g,r.isNew?'<span class="nw">Mới</span>':'')}</div>`).join('')}</div>
    <p class="hint">${list.some(r=>r.c.h<0)?'Nhà đầy, có con vào Phòng chờ.':'Mèo mới đã chạy vào nhà'}</p><button type="button" class="btn" id="mdone">Xong</button>`;
  $('mdone').onclick=()=>{S2.hidden=true;S2.innerHTML='';syncRoom(list[list.length-1].c.id);renderRooms();render()}}
function rollTier(lucky){const o=ODDS[lucky?1:0];let r=R()*100;for(let i=0;i<5;i++){r-=o[i];if(r<0)return i}return 0}
function openBox(){// rút sẵn 3 lá, lưu lại để tắt app giữa chừng cũng không rút lại được
  if(!st.shards)st.shards={};const lucky=Math.floor(R()*3);
  let cards=[0,1,2].map(i=>{let t=rollTier(i===lucky);if(i===lucky&&st.firstBox)t=Math.max(2,t);return{s:pickOne(BY_TIER[t]),lucky:i===lucky}});
  if(st.firstBox)cards=cards.map(c=>c.lucky?c:{s:'round',lucky:false});
  st.pack={cards,picked:[],first:!!st.firstBox};st.firstBox=0;st.pts+=5;guideHit('box');save();showPack()}
const PAW='<svg viewBox="0 0 60 60"><circle cx="30" cy="38" r="12" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="14" cy="24" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="24" cy="14" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="36" cy="14" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="46" cy="24" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/></svg>';
function cardFront(g,extra,foot,title){const t=tierOf(g);return `<div class="front ${TIERS[t].c}${shinyOf(g)?' sh':''}">${extra||''}${imgTag(g,11)}<b>${esc(title||shortName(g))}</b>${foot||tierTag(t)}</div>`}
const shardFoot=(sh,n)=>{const k=needOf(sh);return `<span class="tag ${TIERS[TIER_OF[sh]].c}">${n>=k?'Đủ lá ghép!':`${n}/${k} lá`}</span>`};
function showPack(){const pk=st.pack;if(!pk)return;pk.cards.forEach(c=>{if(!c.s&&c.g)c.s=c.g.shape});const S2=$('stage');S2.hidden=false;
  const done=pk.picked.length>=2;
  const face=(c,i)=>{const missed=done&&!pk.picked.includes(i);return `<div class="back">${PAW}</div>${cardFront(plainG(c.s),(missed?'<span class="nw miss">Bỏ lỡ</span>':'<span class="nw">+1 lá</span>')+(c.lucky?'<span class="lk">May mắn</span>':''),missed?tierTag(TIER_OF[c.s]):shardFoot(c.s,shardsOf(c.s)),known(c.s)?'Lá '+SPR[c.s].name:'Lá '+SPR[c.s].name)}`};
  const ready=readyShards();
  S2.innerHTML=`<h2>${done?'Nhận 2 lá mèo':'Chọn 2 lá'}</h2>
    <div class="cards">${pk.cards.map((c,i)=>{const up=pk.picked.includes(i)||done;return `<div class="card${up?' up':''}${done&&!pk.picked.includes(i)?' missed':''}" data-i="${i}">${up?face(c,i):`<div class="back">${PAW}</div>`}</div>`}).join('')}</div>
    <p class="hint" id="packhint">${done?(ready.length?`Đủ lá ghép ${ready.map(sh=>SPR[sh].name).join(', ')}!`:'Gom thêm lá cùng loài để ghép ra mèo'):pk.picked.length?'Chọn thêm 1 lá':'Một trong ba lá là lá may mắn'}</p>
    ${done?`<div class="acts" style="justify-content:center">${ready.length?'<button type="button" class="btn" id="gomerge">Đi ghép mèo</button>':''}<button type="button" class="btn${ready.length?' ghost':''}" id="packdone">Xong</button></div>`:''}`;
  if(!done)S2.querySelectorAll('.card:not(.up)').forEach(cd=>cd.onclick=()=>{const i=+cd.dataset.i;if(pk.picked.includes(i)||pk.picked.length>=2)return;
    if(pk.first){const L=pk.cards.findIndex(c=>c.lucky);if(pk.picked.length===0&&pk.cards[i].lucky){const o=pk.cards.findIndex((c,j)=>!c.lucky&&j!==i);const tmp=pk.cards[i];pk.cards[i]=pk.cards[o];pk.cards[o]=tmp}}
    const c=pk.cards[i];st.shards[c.s]=shardsOf(c.s)+1;st.shardSeen=st.shardSeen||[];if(!st.shardSeen.includes(c.s))st.shardSeen.push(c.s);pk.picked.push(i);save();
    cd.innerHTML=face(c,i);requestAnimationFrame(()=>cd.classList.add('up'));const t=TIER_OF[c.s];
    $('packhint').textContent=t>=4?'Lá Huyền thoại! Hiếm lắm đó':t>=3?'Lá Siêu hiếm!':shardsOf(c.s)>=needOf(c.s)?`Đủ lá ghép ${SPR[c.s].name}!`:pk.picked.length<2?'Chọn thêm 1 lá':'';
    if(pk.picked.length>=2)setTimeout(showPack,1100)});
  const close=()=>{st.pack=null;save();S2.hidden=true;S2.innerHTML='';render()};
  if(done){$('packdone').onclick=close;if($('gomerge'))$('gomerge').onclick=()=>{close();openTray('box')}}}
function openExchange(){const cost=[0,0,100,300,800];
  sheet(`<div class="row"><h2>Đổi Điểm Hộp</h2><span class="hint">Đang có ${fmt(st.pts)} điểm</span></div>
  ${[2,3,4].map(t=>`<h3>${TIERS[t].n} · ${cost[t]} điểm</h3><div class="grid">${BY_TIER[t].map(s=>{const g=s&&isW(s)?{shape:s,pattern:'plain',color:'white'}:{shape:s,pattern:'plain',color:'white'};const own=st.species.includes(s);
    return `<button type="button" class="ccard${own?'':' locked'}" data-sp="${s}" data-t="${t}"${st.pts<cost[t]?' disabled':''}>${own?imgTag(g):silTag(g)}<span class="nm">${own?esc(SPR[s].name):'???'}</span><em>${cost[t]} điểm</em></button>`}).join('')}</div>`).join('')}
  <button type="button" class="btn ghost" data-close>Đóng</button>`);
  bind($('sheet'),'[data-sp]',(el)=>{const t=+el.dataset.t;if(st.pts<cost[t]){toast(`Cần ${cost[t]} Điểm Hộp`);return}
    twoTap(el,'ex'+el.dataset.sp,'Bấm lần nữa để đổi',()=>{st.pts-=cost[t];const g=rollFur(el.dataset.sp,.05);const isNew=see(g);const c=mkCat(g);home(c);st.cats.push(c);save();closeSheet();showPack2(c,isNew)})})}
function showPack2(c,isNew){const S2=$('stage');S2.hidden=false;const t=tierOf(c.g);
  S2.innerHTML=`<h2>${isNew?'Mèo mới!':'Đã đổi xong'}</h2><div class="cards"><div class="card up"><div class="back">${PAW}</div><div class="front ${TIERS[t].c}${shinyOf(c.g)?' sh':''}">${imgTag(c.g,11)}<b>${esc(shortName(c.g))}</b>${tierTag(t)}</div></div></div><button type="button" class="btn" id="packdone">Xong</button>`;
  $('packdone').onclick=()=>{S2.hidden=true;syncRoom(c.id);renderRooms();render()}}

// ---------- Bảng con mèo ----------
const veil=$('veil');
function sheet(html){$('sheet').innerHTML=html;veil.hidden=false;bind($('sheet'),'[data-close]',closeSheet)}
function closeSheet(){veil.hidden=true;$('sheet').innerHTML='';render()}
veil.addEventListener('click',e=>{if(e.target===veil)closeSheet()});
function sameSpecies(c){return st.cats.filter(x=>x.id!==c.id&&x.g.shape===c.g.shape)}
function sellPrice(c){return TIERS[tierOf(c.g)].sell*(shinyOf(c.g)?3:1)*(1+c.star)}
let pickFor=null;
function openCat(id){const c=st.cats.find(x=>x.id===id);if(!c)return;if(pickFor!==id){catPick=null;pickFor=id}const T=now(),t=tierOf(c.g),dk=dayKey(G(T));
  const h=houseById(c.h);const where=c.h<0?'Phòng chờ':`${ROOMT[h.rooms[c.r].t].n} · ${houseName(h)}`;
  const fav=st.favKnown.includes(c.g.shape)?FD[favOf(c.g.shape)].n:'Chưa biết, cho ăn thử để biết';
  const dup=sameSpecies(c);const canStar=c.star<3&&dup.length>=2;
  const job=c.job?JID[c.job]:null;
  const here=curHouse().id===c.h&&c.r===st.cur;const roomFull=catsIn(curHouse(),st.cur).length>=CAP;
  sheet(`<div class="hero">${imgTag(c.g,c.mood>=60?11:8)}<div style="flex:1;min-width:0"><div>${tierTag(t)} <span class="tag${shinyOf(c.g)?' shiny':''}">${furName(c.g)}</span>${c.star?` <span class="tag t5">${stars(c.star)}</span>`:''}</div>
    <h2>${esc(nameOf(c.g))}</h2><p class="hint">${esc(where)}</p></div></div>
    ${inHosp(c,T)?`<div class="box hl"><h3>Đang nằm viện</h3><p class="hint">Về nhà sau ${dur((c.hosp-G(T))/SPEED)} nữa, khỏe lại và vui hơn.</p></div>`:c.sick?`<div class="box hl"><h3>Mèo đang ốm</h3><p class="hint">Khay vệ sinh bẩn quá nên mèo bị ốm. Mèo ốm không đi làm được và buồn dần. Đưa đi bệnh viện 1 tiếng ngoài đời là khỏe.</p><button type="button" class="btn" data-a="hosp"${st.fish<HOSP[t]?' disabled':''}>Đi bệnh viện · ${HOSP[t]} cá</button></div>`:''}
    <div class="row"><span class="hint" style="width:90px">Tâm trạng ${c.mood}</span><span class="bar mood" style="flex:1"><i style="width:${c.mood}%"></i></span></div>
    ${(c.neg||0)>=WARN_DAYS?`<div class="box hl warnbox"><h3>Mèo sắp bỏ nhà đi</h3><p class="hint">${esc(shortName(c.g))} đã ${c.neg} ngày ${esc((c.why||[]).join(', '))}. Khoảng ${Math.max(1,RUN_DAYS-c.neg)*4} tiếng nữa là bỏ đi. Cho ăn, dọn khay, vuốt ve ngay nhé.</p></div>`:''}
    <p class="hint">Tâm trạng ${c.mood} nên cá và lương ra ×${moodF(c).toFixed(2)} (buồn nhất ×0,6, vui nhất ×1,2)</p>
    <p class="hint">${hungry(c)?'<b class="warnt">Đang đói</b>':`No còn ${Math.floor(hrsLeft(c.full))} giờ`} · ${bored(c)?'<b class="warnt">Đang chán</b>':`Chán sau ${Math.max(0,Math.floor(boredAfter(c)-(now()-(c.joy||0))/H))} giờ`}</p>
    <div class="catfields">${placeBox(c)}${jobBox(c,job)}</div>
    <p class="hint">Món khoái khẩu: <b>${esc(fav)}</b>. Vuốt hôm nay: ${c.petDay===dk?c.pets:0}/3.</p>
    <div class="acts">
      <button type="button" class="btn small" data-a="treat"${c.stick===dk||!TREATS.some(k=>st.pantry[k]>0)?' disabled':''}>${c.stick===dk?'Đã ăn vặt hôm nay':'Cho ăn vặt'}</button>
      ${isWeekend(G(T))?`<button type="button" class="btn small" data-a="spa"${c.spa>G(T)||st.fish<50?' disabled':''}>${c.spa>G(T)?'Đã spa tuần này':'Đi spa · 50 cá'}</button>`:''}
      <button type="button" class="btn small ghost" data-a="cake"${!st.pantry.cake||c.cake>T-365*DAY?' disabled':''}>Bánh sinh nhật</button>
    </div>
    ${!isWeekend(G(T))?'<p class="hint">Spa mở Thứ 7 và Chủ nhật.</p>':''}
    <div class="box"><div class="row"><h3>Mèo trùng</h3><span class="hint">Có ${dup.length} con cùng loài khác</span></div>
      <div class="acts"><button type="button" class="btn small" data-a="star"${canStar?'':' disabled'}>${c.star>=3?'Đã 3 sao':'Lên sao (gộp 2 con cùng loài)'}</button>
      <button type="button" class="btn small ghost" data-a="sell">Bán · ${M(sellPrice(c),'xu')}</button></div>
      ${!canStar&&c.star<3?`<p class="hint">Cần thêm ${2-Math.min(2,dup.length)} con cùng loài để lên sao. Mỗi sao lương +30%.</p>`:''}</div>
    <button type="button" class="btn ghost" data-close>Đóng</button>`);
  bind($('sheet'),'[data-field]',el=>{const k=el.dataset.field;catPick=catPick===k?null:k;const sc=$('sheet').scrollTop;openCat(id);$('sheet').scrollTop=sc});
  bind($('sheet'),'[data-place]',el=>{const v=el.dataset.place;const sc=$('sheet').scrollTop;
    if(v==='wait'){if(c.h<0)return;c.h=-1;c.job=null;toast(`${shortName(c.g)} ra Phòng chờ`)}
    else{const [hid,ri]=v.split(':').map(Number);if(c.h===hid&&c.r===ri)return;const h=houseById(hid);if(catsIn(h,ri).length>=CAP){toast('Phòng này đầy rồi');return}
      c.h=hid;c.r=ri;toast(`${shortName(c.g)} chuyển tới ${ROOMT[h.rooms[ri].t].n}`)}
    catPick=null;save();syncRoom();renderRooms();openCat(id);$('sheet').scrollTop=sc});
  bind($('sheet'),'[data-job]',el=>{const jid=el.dataset.job;if((c.job||'')===jid)return;const j=jid?JID[jid]:null;
    if(j&&jobCount(jid)>=j.slots){toast('Việc này hết chỗ');return}
    const sc=$('sheet').scrollTop;c.job=jid||null;if(j)c.jobSince=gnow();catPick=null;save();syncRoom();renderRooms();
    toast(j?(isWorkTime(gnow())?`${shortName(c.g)} sẽ đi ${j.n.toLowerCase()} từ ca sau`:`${shortName(c.g)} sẽ đi ${j.n.toLowerCase()}`):`${shortName(c.g)} ở nhà nghỉ`);openCat(id);$('sheet').scrollTop=sc});
  bind($('sheet'),'[data-a]',(el)=>{const a=el.dataset.a;
    if(a==='hosp'){if(toHosp(c)){save();syncRoom();renderRooms();toast('Mèo đã tới bệnh viện, 1 tiếng nữa về');closeSheet()}return}
    if(a==='treat'){openTreats(c);return}
    if(a==='stick'){st.pantry.stick--;c.stick=dk;c.mood=Math.min(100,c.mood+10);st.favKnown.includes(c.g.shape)||0;toast('Mèo liếm súp que, sướng rơn');faceHappy(c);save();openCat(id)}
    if(a==='spa'){startSpa(c)}
    if(a==='cake'){st.pantry.cake--;c.cake=T;c.mood=100;toast('Chúc mừng sinh nhật! Tâm trạng đầy 100');faceHappy(c);save();openCat(id)}
    if(a==='move'){c.h=curHouse().id;c.r=st.cur;c.job=c.job;save();syncRoom(c.id);renderRooms();openCat(id)}
    if(a==='wait'){c.h=-1;c.job=null;save();syncRoom();renderRooms();openCat(id)}

  else{o.push({k:'a',p:same?85:42.5},...(same?[]:[{k:'b',p:42.5}]),{k:'up',p:15,t:upT})}
  return{o,cost:TIERS[tm].egg,hrs:TIERS[tm].eggH,rec}}

function marketHtml(){const maxBuy=Math.floor(st.fish/BUY_XU),maxSell=Math.floor(st.xu);

    <div class="box"><div class="row"><h3>Đổi xu lấy cá</h3><span class="hint">1 xu = ${SELL_XU} cá</span></div>
    <div class="acts">${btns('sell',maxSell,v=>`${short(v)} xu → ${short(v*SELL_XU)} cá`)}</div></div>
    <p class="hint">Đổi bao nhiêu cũng được, tới khi hết cá hoặc hết xu. Mở game và chơi thì cá, xu ra gấp đôi.</p>`}
function bindHome(P){const h=curHouse();
  bind(P,'[data-build]',el=>{const t=+el.dataset.build,T=ROOMT[t];twoTap(el,'b'+t,`Xây ${T.n}?`,()=>{st.xu-=T.xu;h.rooms.push(newRoom(t));syncOutdoor(h);rebalance();st.cur=h.rooms.lastIndexOf(h.rooms.filter(r=>r.t===t).pop());
    save();view();actors.clear();syncRoom();renderRooms();toast(`Đã xây ${T.n}`);render()})});
  if($('upg'))$('upg').onclick=e=>{const up=TPL[h.tpl+1];twoTap(e.currentTarget,'upg',`Trả ${fmt(up.xu)} xu?`,()=>{st.xu-=up.xu;h.tpl++;syncOutdoor(h);rebalance();save();renderRooms();toast(`Đã lên ${up.n}`);render()})};
  bind(P,'[data-go]',el=>{st.ch=+el.dataset.go;st.cur=0;save();view();actors.clear();syncRoom();renderRooms();render()});
  bind(P,'[data-rent]',el=>{const x=st.houses[+el.dataset.rent];x.rent=!x.rent;if(x.rent&&st.ch===+el.dataset.rent){st.ch=st.houses.findIndex(y=>!y.rent);st.cur=0;actors.clear();syncRoom();renderRooms()}save();render()});
  bind(P,'[data-zone]',el=>{const z=+el.dataset.zone;zoneOpen=zoneOpen===z?-1:z;render();const d=P.querySelectorAll('details.more');d[d.length-1].open=true});
  bind(P,'[data-lot]',el=>{const [z,i]=el.dataset.lot.split(':').map(Number);const l=LOTS[z][i];if(st.xu<l.price)return;twoTap(el,'lot'+z+i,`Mua lô ${fmt(l.price)} xu?`,()=>buyLot(l))});
  bind(P,'[data-mk]',el=>{const [k,n]=el.dataset.mk.split(':'),v=+n;if(!(v>0))return;
    if(k==='buy'){if(st.fish<v*BUY_XU)return;st.fish-=v*BUY_XU;st.xu+=v;toast(`+${fmt(v)} xu`)}else{if(st.xu<v)return;st.xu-=v;st.fish+=v*SELL_XU;toast(`+${fmt(v*SELL_XU)} cá`)}
    save();renderHud();render()})}
const rentOf=x=>Math.round(zoneOf(x).rent*(x.lot.z===3?1.5:1)*TPL[x.tpl].rooms/2);
function buyLot(l){const fit=TPL.map((t,i)=>[t,i]).filter(([t])=>t.min<=l.area);
  sheet(`<h2>Lô ${l.i+1} · ${ZONES[l.z].n}</h2><p class="hint">${l.area} m². Chọn mẫu nhà để xây ngay (giá lô ${fmt(l.price)} xu cộng giá xây).</p>
    <div class="list">${fit.map(([t,i])=>`<div class="li"><div class="ic"><img src="houses/h${i}.webp" alt=""></div><div class="tx"><b>${t.n}</b><small>${t.rooms} phòng · ${t.out.map(o=>ROOMT[OUT_T[o]].n.toLowerCase()).join(', ')}</small></div><button type="button" class="btn small" data-tpl="${i}"${st.xu<l.price+t.xu?' disabled':''}>${M(l.price+t.xu,'xu')}</button></div>`).join('')}</div>
    <button type="button" class="btn ghost" data-close>Thôi</button>`);

let shopTab='cats';

const CARD_PRICE=[{p:120,c:'cá'},{p:300,c:'cá'},{p:700,c:'cá'},{p:1600,c:'cá'},{p:4000,c:'cá'}];// cùng một loại tiền, bậc cao giá cao
function petShop(){const dk=dayKey(now());if(!st.pet||st.pet.day!==dk||!st.pet.cards){const tiers=[0,R()<.5?0:1,R()<.6?1:2,R()<.06?4:R()<.25?3:2];const used=new Set();
  st.pet={day:dk,cards:1,slots:tiers.map(t=>{let sh;do{sh=pickOne(BY_TIER[t])}while(used.has(sh));used.add(sh);return{s:sh,n:0}})};save()}return st.pet}
const furnPrice=f=>Math.round(f.price*Math.pow(1.5,Math.min(2,(st.bought[f.id]||0))));
const SHOPTABS=[['cats','Lá mèo'],['food','Đồ ăn'],['toilet','Vệ sinh'],['furn','Nội thất'],['toys','Đồ chơi'],['home','Nhà đất'],['market','Chợ cá']];
function gearList(list){return `<div class="list">${list.map(f=>{const tot=totalOf(f.id),p=furnPrice(f);

  if(['furn','toys','home'].includes(shopTab))html+=`<p class="hint">Nội thất, phòng, nhà và đất trả bằng xu, mỗi bậc đắt gấp 10: đồ 10-100, phòng 100-1.000, nhà 1.000-10.000, đất từ 10.000. Đồ ăn, cát và lá mèo trả bằng cá.</p>`;
  if(shopTab==='cats'){const ps=petShop();const T=now();const next=at(T-7*H+DAY,7);
    html+=`<p class="hint">Tiệm bán lá mèo. Gom đủ lá cùng loài rồi ghép ở Hộp mèo. Mỗi loài bán tối đa 3 lá một ngày, hàng mới sau ${dur(next-T)}.</p><div class="grid">${ps.slots.map((sl,i)=>{const sh=sl.s,t=TIER_OF[sh],P=CARD_PRICE[t];const have=P.c==='xu'?st.xu:st.fish;const n=shardsOf(sh),k=needOf(sh),left=3-(sl.n||0);
      return `<div class="ccard${left?'':' away'}">${known(sh)?'':'<span class="tag" style="position:absolute;top:4px;left:4px;background:#F26B6B;color:#fff;border-color:#F26B6B">Mới</span>'}${imgTag(plainG(sh))}<span class="nm">Lá ${esc(SPR[sh].name)}</span>${tierTag(t)}
        <span class="bar"><i style="width:${Math.min(100,n/k*100)}%"></i></span><em>${n>=k?'Đủ lá ghép!':`Có ${n}/${k} lá`}${left?` · tiệm còn ${left}`:''}</em>
        ${left?`<button type="button" class="btn small" data-pet="${i}"${have<P.p?' disabled':''}>${M(P.p,P.c)}</button>`:'<em>Hết hàng hôm nay</em>'}</div>`}).join('')}</div>
      ${readyShards().length?'<button type="button" class="btn wide" id="gomerge2">Đủ lá rồi, sang Hộp mèo ghép</button>':''}`}
  else if(shopTab==='food'){const room=st.pantryCap-pantryMeals();
    const frow=f=>{const p20=Math.round(f.p*20*.85);const meal=f.k==='meal';
      return `<div class="li"><div class="ic">${FOOD_ICON[f.id]}</div><div class="tx"><b>${f.n}</b><small>${f.k==='meal'?`No ${f.full} giờ · `:f.full?`No thêm ${f.full} giờ · `:f.id==='catnip'?'Hết chán ngay · ':''}+${f.mood} vui${f.cap<100?`, tối đa ${f.cap}`:''}${f.fb?` · lương +${f.fb*100}%`:''} · có ${st.pantry[f.id]}</small></div>
        <button type="button" class="btn small" data-buy="${f.id}:1"${st.fish<f.p||(meal&&room<1)?' disabled':''}>${M(f.p,'cá')}</button>
        ${f.id!=='cake'?`<button type="button" class="btn small ghost" data-buy="${f.id}:20"${st.fish<p20||(meal&&room<20)?' disabled':''}>20: ${M(p20,'cá')}</button>`:''}</div>`};
    html+=`<p class="hint">Tủ đồ ăn ${pantryMeals()}/${st.pantryCap} phần. Mua 20 rẻ hơn 15%. Đồ ăn trả bằng cá, máy cho ăn trả bằng xu.</p>
      <h3>Bữa chính</h3><div class="list">${FOODS.filter(f=>f.k==='meal').map(frow).join('')}</div>
      <h3>Ăn vặt</h3><p class="hint">Cho trong thẻ mèo, mỗi con một món mỗi ngày.</p><div class="list">${FOODS.filter(f=>f.k==='treat').map(frow).join('')}</div>
      <h3>Đặc biệt</h3><div class="list">${FOODS.filter(f=>f.k==='special').map(frow).join('')}</div>
      <h3>Máy cho ăn tự động</h3><p class="hint">Đặt trong nhà, mèo đói là máy tự lấy đồ trong tủ cho ăn, kể cả lúc bạn tắt game. Nhiều máy thì cộng số bữa.</p>${gearList(FURN.filter(f=>f.feeder))}
      <div class="task"><div class="tx"><b>Tủ to hơn</b><small>+100 phần</small></div><button type="button" class="btn small ghost" id="cap"${st.xu<100*st.pantryCap/100?' disabled':''}>${M(100*st.pantryCap/100,'xu')}</button></div>`}

      <button type="button" class="link" data-lit="${l.id}">${st.litterUse===l.id?'Đang dùng khi dọn':'Dùng loại này khi dọn'}</button></div>
      <button type="button" class="btn small" data-lbuy="${l.id}:1"${st.fish<l.p?' disabled':''}>${M(l.p,'cá')}</button></div>`).join('')}</div><p class="hint">1 túi = 5 lần dọn, giá tính bằng cá.</p>`}
  else if(shopTab==='furn'){const R0=curRoom();
    html+=`<p class="hint">Mua xong đồ đặt vào ${ROOMT[curT()].n} (đang êm ${comfort(R0)}, cá +${comfort(R0)*10}%).</p><div class="shop">${FURN.filter(f=>!f.toilet&&!f.toy&&!f.gad&&!f.feeder).map(f=>{const tot=totalOf(f.id);const p=furnPrice(f);const placed=false;

  if(!visit.fed)$('vfeed').onclick=()=>help('feed',30,()=>{actors.forEach(a=>{a.expr=11;a.exprT=1.5;a.jump=1})});
  if(!visit.cleaned)$('vclean').onclick=()=>help('clean',20,()=>{st.houses.forEach(h=>boxesOf(h).forEach(b=>b.p.dirt=0))});
  $('vheart').onclick=async()=>{try{const r=await rpc('meo_visit',{p_token:ses.token,p_username:visit.u,p_heart:true});visit.heart=r.heart;toast(`Đã thả tim cho nhà ${visit.u}`);updVisit()}catch(e){toast('Không kết nối được')}};
  if($('vadd'))$('vadd').onclick=async()=>{try{await rpc('meo_friend_add',{p_token:ses.token,p_username:visit.u});visit.friend=true;toast(`Đã kết bạn với ${visit.u}`);updVisit()}catch(e){toast('Không kết bạn được')}}}

// =====================================================================
// Khởi động
// =====================================================================
let bootCloud=false;
function boot(cloud){
if(cloud&&cloud.v===2&&Array.isArray(cloud.cats)&&Array.isArray(cloud.houses)&&cloud.houses.length&&cloud.houses.every(h=>h&&Array.isArray(h.rooms)&&h.rooms.length)){st=cloud;bootCloud=true;st.cats=st.cats.filter(c=>c&&c.g&&SPR[c.g.shape]);ensureToilet();ensureInv()}else load();
process();rebalance();
if(st.cur>=curHouse().rooms.length)st.cur=0;
resize();window.addEventListener('resize',()=>{resize();clampRoom()});view();clampRoom();renderRooms();renderHud();
loadBases(['round','loaf',...st.cats.filter(c=>c.h===curHouse().id).map(c=>c.g.shape),...st.strays.map(x=>x.g.shape),...(st.pack?st.pack.cards.map(c=>c.s||(c.g&&c.g.shape)):[])]).then(()=>{$('loading').remove();syncRoom();render();
  if(st.pack)setTimeout(showPack,300);
  if(CFG&&ses){setTimeout(loadGuests,2000);setInterval(loadGuests,5*60000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-guestsAt>60000)loadGuests()})}
  if(st.migrated){st.migrated=0;save();setTimeout(()=>toast('Game đã lên bản mới! Mèo và đồ đạc vẫn giữ nguyên. Thử mở Hộp mèo nhé',4200),700)}
  else if(!st.tut){st.tut=1;save();setTimeout(()=>{toast('Chào mừng về Nhà Mèo Méo! Bánh Bao và Bánh Mì đã dọn vào. Mở Hộp mèo lấy lá để ghép thêm mèo',4500)},700)}
  let sec=0;
  setInterval(()=>{if(visit){updVisit();return}const T=now(),bx=boost();st.fish+=passivePerHour(T)*bx/3600;st.xu+=xuPerHour()*bx/3600;sec++;
    if(sec%10===0){const before=st.t;process();syncRoom();renderRooms()}
    renderHud();if(sec%5===0){save();if(trayP&&!document.querySelector('.confirm')&&veil.hidden)render()}},1000);
  requestAnimationFrame(tick)})
  .catch(e=>{console.error(e);$('loading').textContent='Không tải được hình mèo. Tải lại trang thử nhé.'});
}

// =====================================================================
// Tài khoản (bản trên Vercel): tên + mật khẩu 3-6 ký tự, lưu tiến độ trên mây. Không có chơi thử.
// =====================================================================
const CFG=window.MEO_AUTH||null;
let ses=null;try{ses=JSON.parse(localStorage.getItem('meo.session')||'null')}catch(e){}
async function rpc(fn,args,keep){const r=await fetch(`${CFG.url}/rest/v1/rpc/${fn}`,{method:'POST',keepalive:!!keep,headers:{apikey:CFG.key,Authorization:'Bearer '+CFG.key,'Content-Type':'application/json'},body:JSON.stringify(args)});
  const tx=await r.text();let d=null;try{d=tx?JSON.parse(tx):null}catch(e){}if(!r.ok)throw new Error((d&&(d.message||d.hint))||('HTTP '+r.status));return d}
const AUTH_ERR=m=>/USERNAME_TAKEN/.test(m)?'Tên này đã có người dùng.':/USERNAME_INVALID/.test(m)?'Tên đăng nhập không hợp lệ.':/PASSWORD_INVALID/.test(m)?'Mật khẩu dài từ 3 đến 6 ký tự.':/LOGIN_FAILED/.test(m)?'Sai tên đăng nhập hoặc mật khẩu.':/LOCKED/.test(m)?'Sai quá nhiều lần. Đợi 5 phút rồi thử lại.':'Không kết nối được máy chủ, thử lại sau.';
function nameIssue(u){if(!u)return null;if(/[^\x00-\x7F]/.test(u))return'Tên đăng nhập không được có dấu tiếng Việt.';if(/\s/.test(u))return'Tên đăng nhập không được có khoảng trắng.';if(/[A-Z]/.test(u))return'Tên đăng nhập không được có chữ hoa.';if(/[^a-z0-9_]/.test(u))return'Chỉ dùng chữ thường, số và dấu _.';if(u.length<3||u.length>16)return'Tên đăng nhập dài từ 3 đến 16 ký tự.';return null}
let cloudT=null,cloudBusy=false;
let lastPush='',lastPushAt=Date.now();
function cloudSoon(){if(!CFG||!ses||cloudT)return;cloudT=setTimeout(()=>{cloudT=null;cloudPush()},Math.max(5000,60000-(Date.now()-lastPushAt)))}
async function cloudPush(keep){const me=visit?visit.real:st;if(!CFG||!ses||!me||cloudBusy)return;const body=JSON.stringify(me);if(body===lastPush)return;cloudBusy=true;try{await rpc('meo_save',{p_token:ses.token,p_state:me},keep);lastPush=body;lastPushAt=Date.now()}catch(e){if(/SESSION/.test(e.message))dropSession()}finally{cloudBusy=false}}
function dropSession(){try{localStorage.removeItem('meo.session')}catch(e){}ses=null;location.reload()}
async function logout(){try{await cloudPush()}catch(e){}try{await rpc('meo_logout',{p_token:ses.token})}catch(e){}try{localStorage.removeItem('meo.session')}catch(e){}location.reload()}
function showAuth(msg){const S2=$('stage');S2.hidden=false;$('loading').textContent='';let mode='in';
  const draw=()=>{S2.innerHTML=`<div class="auth"><img src="houses/h2.webp" alt="" style="height:110px;width:auto"><h2 style="font-size:30px">Nhà Mèo Méo</h2>
    <div class="sub"><button type="button" data-m="in" class="${mode==='in'?'on':''}">Đăng nhập</button><button type="button" data-m="up" class="${mode==='up'?'on':''}">Đăng ký</button></div>
    <p class="hint">${mode==='in'?'Mừng bạn quay lại. Mèo đang chờ ở nhà.':'Tạo tài khoản để nuôi mèo. Tiến độ lưu trên mây, đổi máy vẫn chơi tiếp.'}</p>
    <form id="authf" class="list" autocomplete="on">
      <label class="field"><b>Tên đăng nhập</b><input id="au" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="vd: meomeo" required><small class="hint" id="aui">3-16 ký tự viết liền: chữ thường không dấu, số, dấu _</small></label>
      <label class="field"><b>Mật khẩu</b><input id="ap" type="password" autocomplete="${mode==='in'?'current-password':'new-password'}" minlength="3" maxlength="6" required><small class="hint">3-6 ký tự</small></label>
      <p class="why" id="aerr" role="alert">${msg||''}</p>
      <button type="submit" class="btn wide" id="ago">${mode==='in'?'Vào nhà':'Tạo tài khoản'}</button>${mode==='in'?'<button type="button" class="link" id="aforgot" style="align-self:center">Quên mật khẩu?</button>':''}</form></div>`;
    S2.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;msg='';draw()});
    if($('aforgot'))$('aforgot').onclick=showForgot;
    const u=$('au');u.oninput=()=>{const x=nameIssue(u.value);$('aui').textContent=x||'3-16 ký tự viết liền: chữ thường không dấu, số, dấu _';$('aui').className=x?'why':'hint'};
    $('authf').onsubmit=async e=>{e.preventDefault();const un=u.value.trim(),pw=$('ap').value;const bad=nameIssue(un)||(pw.length<3||pw.length>6?'Mật khẩu dài từ 3 đến 6 ký tự.':null);if(bad){$('aerr').textContent=bad;return}
      $('ago').disabled=true;$('ago').textContent='Đang vào…';
      try{const d=await rpc(mode==='in'?'meo_login':'meo_register',{p_username:un,p_password:pw});ses={token:d.token,username:d.username};localStorage.setItem('meo.session',JSON.stringify(ses));
        if(mode==='up'){try{const r=await rpc('meo_recovery_create',{p_token:ses.token});if(r&&r.code){showCode(r.code,()=>{S2.hidden=true;S2.innerHTML='';start()});return}}catch(x){}}
        S2.hidden=true;S2.innerHTML='';start()}
      catch(err){$('aerr').textContent=AUTH_ERR(err.message);$('ago').disabled=false;$('ago').textContent=mode==='in'?'Vào nhà':'Tạo tài khoản'}}};
  draw()}
// Mã khôi phục: hiện đúng một lần, ghi lại để lỡ quên mật khẩu
function showCode(code,next){const S2=$('stage');S2.hidden=false;
  S2.innerHTML=`<div class="auth"><h2>Mã khôi phục của bạn</h2><p class="hint">Quên mật khẩu thì dùng mã này để đặt mật khẩu mới. Mã chỉ hiện một lần, hãy chụp màn hình hoặc ghi lại.</p>
    <div class="code">${esc(code)}</div><button type="button" class="btn small ghost" id="ccopy">Chép mã</button>
    <button type="button" class="btn wide" id="cok">Đã ghi lại, vào nhà</button></div>`;
  $('ccopy').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>toast('Đã chép mã'),()=>toast('Không chép được, hãy chụp màn hình'))}catch(e){toast('Không chép được, hãy chụp màn hình')}};
  $('cok').onclick=next}
function showForgot(){const S2=$('stage');S2.hidden=false;
  S2.innerHTML=`<div class="auth"><h2>Quên mật khẩu</h2><p class="hint">Nhập tên đăng nhập, mã khôi phục (dạng ABCD-EFGH) và mật khẩu mới. Không có mã thì nhắn Fanpage hoặc người tạo game để được cấp lại.</p>
    <form id="ff" class="list"><label class="field"><b>Tên đăng nhập</b><input id="fu" autocapitalize="none" spellcheck="false" maxlength="16" required></label>
    <label class="field"><b>Mã khôi phục</b><input id="fc" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD-EFGH" required></label>
    <label class="field"><b>Mật khẩu mới</b><input id="fp" type="password" autocomplete="new-password" minlength="3" maxlength="6" required><small class="hint">3-6 ký tự</small></label>
    <p class="why" id="ferr" role="alert"></p><button type="submit" class="btn wide" id="fgo">Đặt mật khẩu mới</button>
    <button type="button" class="link" id="fback" style="align-self:center">Quay lại đăng nhập</button></form></div>`;
  $('fback').onclick=()=>showAuth();
  $('ff').onsubmit=async e=>{e.preventDefault();const pw=$('fp').value;if(pw.length<3||pw.length>6){$('ferr').textContent='Mật khẩu mới dài từ 3 đến 6 ký tự.';return}
    $('fgo').disabled=true;try{const d=await rpc('meo_recover',{p_username:$('fu').value.trim().toLowerCase(),p_code:$('fc').value,p_new_password:pw});
      ses={token:d.token,username:d.username};localStorage.setItem('meo.session',JSON.stringify(ses));
      try{const r=await rpc('meo_recovery_create',{p_token:ses.token});if(r&&r.code){showCode(r.code,()=>{S2.hidden=true;S2.innerHTML='';start()});return}}catch(x){}
      S2.hidden=true;S2.innerHTML='';start()}
    catch(err){$('ferr').textContent=/RECOVER_FAILED/.test(err.message)?'Sai tên đăng nhập hoặc mã khôi phục.':AUTH_ERR(err.message);$('fgo').disabled=false}}}
function openAccount(){sheet(`<div class="row"><h2>Tài khoản</h2><span class="hint">${esc(ses.username)}</span></div>
    <h3>Đổi mật khẩu</h3><form id="cpf" class="list"><label class="field"><b>Mật khẩu cũ</b><input id="co" type="password" autocomplete="current-password" maxlength="6" required></label>
    <label class="field"><b>Mật khẩu mới</b><input id="cn" type="password" autocomplete="new-password" minlength="3" maxlength="6" required><small class="hint">3-6 ký tự</small></label>
    <p class="why" id="cperr" role="alert"></p><button type="submit" class="btn" id="cpgo">Đổi mật khẩu</button></form>
    <h3>Mã khôi phục</h3><p class="hint">Tạo mã mới nếu bạn làm mất mã cũ. Mã cũ sẽ hết hiệu lực.</p><button type="button" class="btn small ghost" id="newcode">Tạo mã mới</button>
    <button type="button" class="btn ghost" data-close>Đóng</button>`);
  $('cpf').onsubmit=async e=>{e.preventDefault();const nw=$('cn').value;if(nw.length<3||nw.length>6){$('cperr').textContent='Mật khẩu mới dài từ 3 đến 6 ký tự.';return}
    $('cpgo').disabled=true;try{await rpc('meo_change_password',{p_token:ses.token,p_old:$('co').value,p_new:nw});closeSheet();toast('Đã đổi mật khẩu')}
    catch(err){$('cperr').textContent=/OLD_WRONG/.test(err.message)?'Mật khẩu cũ không đúng.':/SESSION/.test(err.message)?'Phiên đăng nhập đã hết, đăng nhập lại nhé.':AUTH_ERR(err.message);$('cpgo').disabled=false}};
  $('newcode').onclick=e=>twoTap(e.currentTarget,'newcode','Bấm lần nữa, mã cũ sẽ hết hiệu lực',async()=>{try{const r=await rpc('meo_recovery_create',{p_token:ses.token});closeSheet();showCode(r.code,()=>{$('stage').hidden=true;$('stage').innerHTML=''})}catch(err){toast('Không tạo được mã, thử lại sau')}})}
async function start(){
  if(!CFG){boot(null);return}
  if(!ses){showAuth();return}
  KEY='nha-meo-meo-v2:'+ses.username;
  $('loading').textContent='Đang mở cửa nhà…';
  let fresh=false;try{fresh=localStorage.getItem('meo.fresh')==='1';localStorage.removeItem('meo.fresh')}catch(e){}
  let cloud=null;
  try{const d=await rpc('meo_load',{p_token:ses.token});cloud=d&&d.state}catch(e){if(/SESSION/.test(e.message)){try{localStorage.removeItem('meo.session')}catch(x){}ses=null;showAuth('Phiên đăng nhập đã hết, đăng nhập lại nhé.');return}}
  if(fresh)cloud=null;
  // bản trên máy mới hơn bản trên mây (vd lưu trên mây chưa kịp) thì dùng bản trên máy
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
  if(cloud&&local&&local.v===2&&(local.last||0)>(cloud.last||0)+60000)cloud=null;
  if(!cloud&&!local)resetting=false;
  boot(cloud);if(!bootCloud)cloudPush()}
start();
document.addEventListener('visibilitychange',()=>{if(!st)return;if(visit){if(document.visibilityState!=='visible')cloudPush(true);return}if(document.visibilityState==='visible'){process();syncRoom();renderRooms();render()}else{save();cloudPush(true)}});
// Dùng khi thử nghiệm: tua giờ
window.__meo={skip(h){dbg+=h*H;try{localStorage.setItem('meo-dbg',dbg)}catch(e){}process();syncRoom();renderRooms();render()},get st(){return st},reset(){dbg=0;try{localStorage.removeItem('meo-dbg')}catch(e){}}};
})();

</script>
