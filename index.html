<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F2">
<style>[hidden]{display:none!important}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Nhà Mèo Méo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;600;700&display=swap">
<style>
/* Một bảng màu sáng cố định theo tranh vẽ tay: giấy kem, mực đen, vàng bơ */
:root{
  --ink:#2A272C;--paper:#FBF8F2;--card:#FFFFFF;--muted:#7A7470;--line:#E6DED2;--accent:#FFD36B;--soft:#FFF1CC;
  --ok:#D7EFD9;--pink:#FFD6DD;--lilac:#E9DDFF;--gold:#FFE59A;
  --r1:#E9E4DC;--r2:#CFE8F7;--r3:#D9F0C8;--r4:#E6D4FF;--r5:#FFE08A;
  --display:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --body:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:var(--ink)}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;line-height:1.2}
h3{font-family:var(--display);font-weight:800;font-size:16px;margin:0;line-height:1.2}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums}

/* Phòng toàn màn hình */
.room{position:fixed;inset:0;z-index:0;user-select:none;-webkit-user-select:none;touch-action:manipulation;background:var(--paper)}
.room canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.room.editing canvas{touch-action:none;cursor:grab}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);z-index:5}
.bubble{position:absolute;z-index:15;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:4px 10px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,-100%);pointer-events:none}
.bubble b{font-family:var(--display);font-size:15px}
.heart{position:absolute;z-index:16;pointer-events:none;width:22px;animation:rise 1s ease-out forwards}
@keyframes rise{to{transform:translateY(-50px) scale(1.3);opacity:0}}

/* HUD */
.hud{position:fixed;z-index:10;display:flex;align-items:center;gap:6px}
.top{top:calc(8px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.pill{background:rgba(255,255,255,.94);border:2px solid var(--ink);border-radius:999px;padding:3px 12px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.money{display:flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.money b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1}
.money svg{width:20px;height:20px;flex:0 0 auto}
.clock{font-size:12.5px;font-weight:700;line-height:1.15;text-align:right;flex-direction:column;align-items:flex-end;gap:0;padding:3px 12px;border-radius:16px}
.clock small{font-weight:600;color:var(--muted);font-size:11.5px}
.rooms{top:calc(52px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));overflow-x:auto;padding:2px;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rchip{flex:0 0 auto;border:2px solid var(--line);background:rgba(255,255,255,.92);border-radius:12px;padding:3px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;line-height:1.2;min-width:0}
.rchip b{font-size:12.5px;white-space:nowrap}
.rchip span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rchip.on{border-color:var(--ink);background:var(--soft)}
.rchip.out b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8BC48A;margin-right:4px;vertical-align:1px}
.rchip.add{border-style:dashed;background:rgba(251,248,242,.9)}
.rchip.add b{color:var(--muted)}
.notice{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(104px + env(safe-area-inset-top,0px));background:rgba(42,39,44,.88);color:#fff;border-radius:999px;padding:4px 14px;font-size:12.5px;font-weight:600;white-space:nowrap;pointer-events:none;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
.notice:empty{display:none}
.editbtn{position:fixed;z-index:10;left:calc(10px + env(safe-area-inset-left,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));font-weight:700;font-size:12.5px;border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer}
.editbtn.on{background:var(--accent)}
.edithint{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:11;background:var(--ink);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;white-space:nowrap}
.dock{left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:rgba(255,255,255,.94);border:2.5px solid var(--ink);border-radius:18px;padding:4px}
.dock button{position:relative;border:0;background:transparent;border-radius:13px;padding:4px 2px 3px;min-height:48px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:800;font-family:var(--display);font-size:12px;line-height:1.1;min-width:0;white-space:nowrap}
.dock button svg{width:26px;height:26px}
.dock button.on{background:var(--accent)}
.dock button:active{transform:scale(.95)}
.dot{position:absolute;top:-2px;right:2px;min-width:20px;height:20px;border-radius:999px;background:#F26B6B;color:#fff;border:2px solid var(--ink);font-family:var(--body);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.dot:empty{display:none}

/* Khay */
.tray{position:fixed;z-index:20;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:min(64vh,600px);background:var(--card);border:2.5px solid var(--ink);border-radius:18px;display:flex;flex-direction:column;transform:translateY(calc(100% + 140px));transition:transform .28s ease;box-shadow:0 8px 30px rgba(40,37,42,.25)}
.tray.open{transform:none}
.traytop{display:flex;gap:8px;align-items:center;padding:10px 10px 6px;border-bottom:2px solid var(--line)}
.traytop h2{flex:1}
.x{flex:0 0 auto;width:36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:var(--card);font-weight:800;font-size:18px;cursor:pointer;line-height:1}
.panels{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px 12px 16px}
.panel{display:flex;flex-direction:column;gap:12px}
.sub{display:flex;gap:4px;background:var(--paper);border-radius:12px;padding:4px;overflow-x:auto;scrollbar-width:none}
.sub button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:6px 10px;cursor:pointer;color:var(--muted);font-weight:700;font-size:13.5px;white-space:nowrap}
.sub button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--ink)}
.box{border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.box.hl{border-color:var(--ink);background:#FFF9EA}
.btn{font-weight:800;font-family:var(--display);font-size:17px;border:2.5px solid var(--ink);background:var(--accent);border-radius:14px;padding:6px 14px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:var(--line);color:var(--muted);cursor:not-allowed;box-shadow:0 3px 0 var(--muted);border-color:var(--muted)}
.btn.small{font-size:14px;padding:3px 10px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.wide{width:100%}
.btn.confirm{background:#F7A9A9}
.why{font-size:12px;color:#B0503F;font-weight:600}
.bar{height:9px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper);min-width:50px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.mood i{background:#F7A1B4}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;border:1.5px solid var(--ink);background:var(--ok);white-space:nowrap;line-height:1.5}
.t1{background:var(--r1)}.t2{background:var(--r2)}.t3{background:var(--r3)}.t4{background:var(--r4)}.t5{background:var(--r5)}
.tag.shiny{background:linear-gradient(90deg,#FFD6E4,#D6F5FF,#FFF3B0)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ccard{position:relative;border:2px solid var(--line);border-radius:12px;background:var(--card);padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;font-size:11.5px;line-height:1.25;text-align:center;cursor:pointer;min-height:122px;min-width:0}
.ccard img{max-width:76px;max-height:74px;width:auto;height:auto}
.ccard .nm{font-weight:700}
.ccard em{font-style:normal;font-size:10.5px;color:var(--muted)}
.ccard .bar{width:70%;height:7px;border-width:1.5px}
.ccard.sel{border-color:var(--ink);background:var(--soft)}
.ccard.away{opacity:.7}
.ccard.locked{background:var(--paper);border-style:dashed;cursor:default}
.ccard.locked img{filter:brightness(0) opacity(.18)}
.ccard .stars{position:absolute;top:3px;left:5px;font-size:11px;color:#E0A100;letter-spacing:-1px;font-weight:800}
.ccard .tierd{position:absolute;top:4px;right:4px;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink)}
.ccard.shinyc{box-shadow:inset 0 0 0 2px #FFE59A}
.qm{font-family:var(--display);font-weight:800;font-size:32px;color:var(--muted);line-height:74px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
.li .ic{width:48px;height:48px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.li .ic img,.li .ic svg{max-width:48px;max-height:48px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14px;line-height:1.25}
.li .tx small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.li.off{background:var(--paper);border-style:dashed}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.mini{width:34px;height:34px;border-radius:8px;background:var(--paper);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;border:1.5px solid var(--line)}
.mini img{max-width:32px;max-height:32px}
.mini.empty{border-style:dashed}
.odds{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.odds th,.odds td{border-bottom:1.5px solid var(--line);padding:3px 4px;text-align:right}
.odds th:first-child,.odds td:first-child{text-align:left}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.sitem{border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--card)}
.sitem.placed{border-color:#9CCB9F;background:#F6FBF6}
.sitem .th{height:70px;display:flex;align-items:flex-end;justify-content:center}
.sitem .th img{max-height:70px;max-width:104px}
.sitem .th svg,.li .ic svg{width:60px;height:60px}
.li .ic svg{width:46px;height:46px}
.sitem .nm{font-weight:700;font-size:13.5px;line-height:1.2}
.sitem .nm small{display:block;font-weight:600;color:var(--muted);font-size:11.5px}
.meter{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:var(--paper)}
.meter i{display:block;height:100%;background:var(--accent)}
.toast{position:fixed;left:50%;top:calc(136px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:7px 16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}

/* Bảng con mèo và lớp phủ */
.veil{position:fixed;inset:0;z-index:40;background:rgba(42,39,44,.45);display:flex;align-items:flex-end;justify-content:center;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
.veil[hidden]{display:none!important}
.sheet{width:100%;max-width:520px;max-height:86vh;overflow-y:auto;background:var(--card);border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px 16px;display:flex;flex-direction:column;gap:10px}
.sheet .hero{display:flex;gap:12px;align-items:flex-end}
.sheet .hero img{max-width:120px;max-height:130px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.stage{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 40%,#FFF6DE,#F3E6CC);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.stage[hidden]{display:none!important}
.stage h2{font-size:24px;text-align:center}
.cards{display:flex;gap:10px;justify-content:center;perspective:900px;flex-wrap:nowrap}
.card{width:min(29vw,150px);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.up{transform:rotateY(180deg)}
.card>div{position:absolute;inset:0;border:2.5px solid var(--ink);border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 4px;gap:2px;overflow:hidden}
.card .back{background:#FFD36B repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.35) 10px 20px);justify-content:center}
.card .back svg{width:60%}
.card .back.lucky{background:#F7B6C8 repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.4) 10px 20px);box-shadow:0 0 0 3px #fff,0 0 22px #FFB3D0}
.card .front{transform:rotateY(180deg);background:var(--card)}
.card .front img{max-width:92%;max-height:62%;margin-bottom:auto;margin-top:12%}
.card .front b{font-size:12px;line-height:1.2;text-align:center}
.card .front.t1{background:#F7F4EF}.card .front.t2{background:#E8F4FB}.card .front.t3{background:#EEF8E6}.card .front.t4{background:#F2EAFF}.card .front.t5{background:#FFF3C4}
.card .front.t4,.card .front.t5{box-shadow:inset 0 0 0 3px #fff}
.card .front.sh::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 45%,transparent 60%);animation:shine 1.6s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.card .nw{position:absolute;top:6px;left:6px;font-size:10px;font-weight:800;background:#F26B6B;color:#fff;border-radius:99px;padding:0 6px}
.bigbox{width:min(56vw,240px);cursor:pointer;animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bigbox.tear{animation:tear .5s forwards}
@keyframes tear{to{transform:scale(1.3);opacity:0}}
.egg{width:64px;height:78px;flex:0 0 auto;cursor:pointer}
.egg.wig{animation:wig 1.8s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wig{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-8deg)}90%{transform:rotate(7deg)}95%{transform:rotate(-4deg)}}
.spa{position:relative;width:min(80vw,320px);height:min(80vw,320px)}
.spa img{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);max-width:60%;max-height:60%}
.spa .tub{position:absolute;left:0;right:0;bottom:0;height:34%;background:#CFE8F7;border:2.5px solid var(--ink);border-radius:20px 20px 40px 40px}
.spa .bub{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#E4F3FF 60%,#BFE0F7);border:2px solid var(--ink);cursor:pointer;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}

/* Hàng việc cần làm: icon, tên, một dòng trạng thái, một nút */
.task{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card);min-height:60px}
.task.hl{border-color:var(--ink);background:#FFF9EA}
.task .ic,.li .ic{width:40px;height:40px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.task .ic img,.task .ic svg,.li .ic img,.li .ic svg{max-width:40px;max-height:40px;width:auto;height:auto}
.task .ic svg,.li .ic svg{width:38px;height:38px}
.task .ic.big{width:56px;height:56px}.task .ic.big img{max-width:56px;max-height:56px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-size:14.5px;line-height:1.25}
.task .tx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.warn{color:#B0503F;font-weight:700}
.seg{display:flex;gap:4px;margin-top:-4px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;min-height:32px}
.seg button.on{border-color:var(--ink);background:var(--soft);color:var(--ink)}
.panel{gap:8px}
.li{padding:6px 8px;gap:8px}
.li .tx b{font-size:14px}
.li.on{border-color:#9CCB9F;background:#F6FBF6}
.li .btn.small{padding:3px 9px;font-size:13.5px}
.link{border:0;background:none;padding:2px 0 0;font-size:12px;font-weight:700;color:#2E7BB8;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
details.more{border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--card)}
details.more>summary{font-family:var(--display);font-weight:800;font-size:15px;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:28px}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"";width:9px;height:9px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg);margin-right:4px;transition:transform .2s}
details.more[open]>summary::after{transform:rotate(-135deg)}
details.more[open]>summary{margin-bottom:8px}
.sub{position:sticky;top:-10px;z-index:2}
.card.missed .front{opacity:.6;filter:grayscale(.7)}
.card .nw.miss{background:var(--muted)}
.card .lk{position:absolute;top:6px;right:6px;font-size:10px;font-weight:800;background:#F7A1B4;color:#2A272C;border:1.5px solid var(--ink);border-radius:99px;padding:0 6px}
@media (min-width:760px){.tray{left:auto;width:460px;top:calc(8px + env(safe-area-inset-top,0px));height:auto}.dock{left:auto;width:440px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="room" id="room"><div class="loading" id="loading">Đang gọi mèo về…</div><canvas id="cv"></canvas></div>
<div class="hud top">

}

function away(c,t=now()){const g=G(t);return !!c.job&&c.h>=0&&!c.sick&&!(c.hosp>g)&&isWorkTime(g)&&c.jobSince<=shiftStart(g)}

// khay vệ sinh của một nhà
function boxesOf(h){const out=[];h.rooms.forEach((r,ri)=>{for(const id in r.furn)if(FID[id]&&FID[id].toilet)out.push({f:FID[id],p:r.furn[id],ri})});return out}

  bx.forEach(b=>{b.p.dirt=Math.min(100,(b.p.dirt||0)+hours/24*22*load*b.f.rate*(LT[b.p.lit||'clay']||LT.clay).rate)})})}

  save();toast(n?`Đã dọn ${n} khay${miss?`, còn ${miss} khay chưa dọn vì hết cát`:''}`:miss?'Hết cát mèo rồi. Mua ở Mua sắm, mục Vệ sinh':'Khay nào cũng sạch');render()}

function nextBoundary(t){const c=[at(t,7),at(t,17),at(t+DAY,7)].filter(b=>b>t);return Math.min(...c)}
function process(){
  const T=now();let t=st.t||T;if(T-t>30*DAY)t=T-30*DAY;
  // cá tự ra lúc tắt game: 40%, tối đa 12 giờ
  const gap=T-(st.last||T);if(gap>2*MIN){const hrs=Math.min(12,gap/H);const got=passivePerHour(st.last)*hrs*.4;if(got>=1){st.fish+=got;st.offline=(st.offline||0)+got}}
  const gT=G(T);let gp=Math.max(G(t),Math.min(gT,st.gt||G(t)));
  for(let b=nextBoundary(G(t));b<=gT;b=nextBoundary(b)){
    if(b>gp){accrue((b-gp)/H);gp=b}
    const hh=new Date(b).getHours();
    if(hh===7)morning(b);else if(hh===17&&isWeekday(b))payday(b)}
  if(gT>gp)accrue((gT-gp)/H);st.gt=gT;
  st.cats.forEach(c=>{if(c.hosp&&gT>=c.hosp){c.hosp=0;c.sick=0;c.mood=Math.max(c.mood,60);st.healed=(st.healed||0)+1}});
  const rd=dayKey(T);if(st.rday!==rd){if(st.rday)payRent();st.rday=rd}
  st.t=T;
  while(st.free<2&&st.freeAt&&T>=st.freeAt){st.free++;st.freeAt=st.free<2?st.freeAt+12*H:0}
  strays(T);
}
function morning(b){st.cats.forEach(c=>{c.mood=Math.max(0,c.mood-6-(c.sick?8:0))});

    st.cats.forEach(c=>{if(c.h!==h.id||c.sick||c.hosp)return;if(d>=70)c.mood=Math.max(0,c.mood-6);if(R()<p){c.sick=b;st.newSick=(st.newSick||0)+1}})})}

}

function rollTier(lucky){const o=ODDS[lucky?1:0];let r=R()*100;for(let i=0;i<5;i++){r-=o[i];if(r<0)return i}return 0}
function openBox(){// rút sẵn 3 lá, lưu lại để tắt app giữa chừng cũng không rút lại được
  const lucky=Math.floor(R()*3);
  const cards=[0,1,2].map(i=>{let t=rollTier(i===lucky);if(i===lucky&&st.firstBox)t=Math.max(2,t);return{g:rollFur(pickOne(BY_TIER[t])),lucky:i===lucky}});
  st.pack={cards,picked:[],first:!!st.firstBox};st.firstBox=0;st.pts+=5;save();showPack()}
const PAW='<svg viewBox="0 0 60 60"><circle cx="30" cy="38" r="12" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="14" cy="24" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="24" cy="14" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="36" cy="14" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/><circle cx="46" cy="24" r="6" fill="#fff" stroke="#2A272C" stroke-width="3"/></svg>';
function cardFront(g,extra){const t=tierOf(g);return `<div class="front ${TIERS[t].c}${shinyOf(g)?' sh':''}">${extra||''}${imgTag(g,11)}<b>${esc(shortName(g))}</b>${tierTag(t)}</div>`}
function showPack(){const pk=st.pack;if(!pk)return;const S2=$('stage');S2.hidden=false;
  const done=pk.picked.length>=2;
  S2.innerHTML=`<h2>${done?'Hai bé mèo mới!':'Chọn 2 lá'}</h2>
    <div class="cards">${pk.cards.map((c,i)=>{const up=pk.picked.includes(i)||done;const missed=done&&!pk.picked.includes(i);
      return `<div class="card${up?' up':''}${missed?' missed':''}" data-i="${i}"><div class="back">${PAW}</div>${cardFront(c.g,(missed?'<span class="nw miss">Bỏ lỡ</span>':c.isNew?'<span class="nw">Mới</span>':'')+(up&&c.lucky?'<span class="lk">May mắn</span>':''))}</div>`}).join('')}</div>
    <p class="hint" id="packhint">${done?(pk.wait?`${pk.wait} con vào Phòng chờ vì nhà đầy.`:'Mèo mới đã chạy vào nhà'):pk.picked.length?'Chọn thêm 1 lá':'Một trong ba lá là lá may mắn'}</p>
    ${done?'<button type="button" class="btn" id="packdone">Xong</button>':''}`;
  if(!done)S2.querySelectorAll('.card:not(.up)').forEach(cd=>cd.onclick=()=>{const i=+cd.dataset.i;if(pk.picked.includes(i)||pk.picked.length>=2)return;
    if(pk.first&&!pk.picked.length){const L=pk.cards.findIndex(c=>c.lucky);if(L!==i){const tmp=pk.cards[i];pk.cards[i]=pk.cards[L];pk.cards[L]=tmp}}
    const c=pk.cards[i];c.isNew=see(c.g);const cat=mkCat({...c.g});if(!home(cat))pk.wait=(pk.wait||0)+1;st.cats.push(cat);pk.lastId=cat.id;pk.picked.push(i);save();
    cd.innerHTML=`<div class="back">${PAW}</div>${cardFront(c.g,(c.isNew?'<span class="nw">Mới</span>':'')+(c.lucky?'<span class="lk">May mắn</span>':''))}`;
    requestAnimationFrame(()=>cd.classList.add('up'));const t=tierOf(c.g);
    $('packhint').textContent=t>=4?'Huyền thoại! Hiếm lắm đó':shinyOf(c.g)?'Mèo lấp lánh!':t>=3?'Siêu hiếm!':pk.picked.length<2?'Chọn thêm 1 lá':'';
    if(pk.picked.length>=2)setTimeout(showPack,1100)});
  if(done)$('packdone').onclick=()=>{const id=pk.lastId;st.pack=null;save();S2.hidden=true;S2.innerHTML='';syncRoom(id);renderRooms();render()}}
function openExchange(){const cost=[0,0,100,300,800];
  sheet(`<div class="row"><h2>Đổi Điểm Hộp</h2><span class="hint">Đang có ${fmt(st.pts)} điểm</span></div>
  ${[2,3,4].map(t=>`<h3>${TIERS[t].n} · ${cost[t]} điểm</h3><div class="grid">${BY_TIER[t].map(s=>{const g=s&&isW(s)?{shape:s,pattern:'plain',color:'white'}:{shape:s,pattern:'plain',color:'white'};const own=st.species.includes(s);

    twoTap(el,'ex'+el.dataset.sp,'Bấm lần nữa để đổi',()=>{st.pts-=cost[t];const g=rollFur(el.dataset.sp,.05);const isNew=see(g);const c=mkCat(g);home(c);st.cats.push(c);save();closeSheet();showPack2(c,isNew)})})}
function showPack2(c,isNew){const S2=$('stage');S2.hidden=false;const t=tierOf(c.g);

    <p class="hint">Xu còn có từ bán mèo trùng, cho thuê nhà và đủ trang Sổ mèo.</p>`}
function bindHome(P){const h=curHouse();
  bind(P,'[data-build]',el=>{const t=+el.dataset.build,T=ROOMT[t];twoTap(el,'b'+t,`Xây ${T.n}?`,()=>{st.xu-=T.xu;h.rooms.push(newRoom(t));syncOutdoor(h);rebalance();st.cur=h.rooms.lastIndexOf(h.rooms.filter(r=>r.t===t).pop());
    save();view();actors.clear();syncRoom();renderRooms();toast(`Đã xây ${T.n}`);render()})});
  if($('upg'))$('upg').onclick=e=>{const up=TPL[h.tpl+1];twoTap(e.currentTarget,'upg',`Trả ${fmt(up.xu)} xu?`,()=>{st.xu-=up.xu;h.tpl++;syncOutdoor(h);rebalance();save();renderRooms();toast(`Đã lên ${up.n}`);render()})};
  bind(P,'[data-go]',el=>{st.ch=+el.dataset.go;st.cur=0;save();view();actors.clear();syncRoom();renderRooms();render()});
  bind(P,'[data-rent]',el=>{const x=st.houses[+el.dataset.rent];x.rent=!x.rent;if(x.rent&&st.ch===+el.dataset.rent){st.ch=st.houses.findIndex(y=>!y.rent);st.cur=0;actors.clear();syncRoom();renderRooms()}save();render()});
  bind(P,'[data-zone]',el=>{const z=+el.dataset.zone;zoneOpen=zoneOpen===z?-1:z;render();const d=P.querySelectorAll('details.more');d[d.length-1].open=true});
  bind(P,'[data-lot]',el=>{const [z,i]=el.dataset.lot.split(':').map(Number);const l=LOTS[z][i];if(st.xu<l.price)return;twoTap(el,'lot'+z+i,`Mua lô ${fmt(l.price)} xu?`,()=>buyLot(l))});
  bind(P,'[data-mk]',el=>{const v=+el.dataset.mk;if(st.fish<v*20||v>marketLeft())return;st.fish-=v*20;st.xu+=v;st.market.xu+=v;save();toast(`+${v} xu`);render()})}
const rentOf=x=>Math.round(zoneOf(x).rent*(x.lot.z===3?1.5:1)*TPL[x.tpl].rooms/2);
function buyLot(l){const fit=TPL.map((t,i)=>[t,i]).filter(([t])=>t.min<=l.area);
  sheet(`<h2>Lô ${l.i+1} · ${ZONES[l.z].n}</h2><p class="hint">${l.area} m². Chọn mẫu nhà để xây ngay (giá lô ${fmt(l.price)} xu cộng giá xây).</p>
    <div class="list">${fit.map(([t,i])=>`<div class="li"><div class="ic"><img src="houses/h${i}.webp" alt=""></div><div class="tx"><b>${t.n}</b><small>${t.rooms} phòng · ${t.out.map(o=>ROOMT[OUT_T[o]].n.toLowerCase()).join(', ')}</small></div><button type="button" class="btn small" data-tpl="${i}"${st.xu<l.price+t.xu?' disabled':''}>${fmt(l.price+t.xu)} xu</button></div>`).join('')}</div>
    <button type="button" class="btn ghost" data-close>Thôi</button>`);
  bind($('sheet'),'[data-tpl]',el=>{const i=+el.dataset.tpl,c=l.price+TPL[i].xu;if(st.xu<c)return;st.xu-=c;st.lots.push({z:l.z,i:l.i});
    const h=newHouse({z:l.z,i:l.i,area:l.area,trait:l.trait},i);st.houses.push(h);st.ch=st.houses.length-1;st.cur=0;rebalance();save();closeSheet();view();actors.clear();syncRoom();renderRooms();toast(`Đã xây ${TPL[i].n} ở ${ZONES[l.z].n}`)})}

// ---------- Mèo hoang: bát ăn và xin ở lại ----------
function openBowl(){const h=curHouse();const T=now();
  sheet(`<h2>Bát ăn ngoài hiên</h2>${h.bowl?`<p class="hint">Đang có ${FD[h.bowl.food].n}, còn ${dur(h.bowl.until-T)}. Mèo hoang đang ghé: ${st.strays.filter(s=>s.h===h.id&&s.arrive<=T).length} con.</p>`:'<p class="hint">Bát đang trống. Đổ 3 phần đồ ăn để mời mèo hoang ghé trong 6 tiếng ngoài đời. Đồ càng xịn, mèo hiếm càng hay ghé.</p>'}
    <div class="list">${MEALS.map(k=>`<div class="li"><div class="ic">${FOOD_ICON[k]}</div><div class="tx"><b>${FD[k].n}</b><small>${{kibble:'Mèo Thường, Khá ghé',good:'Thỉnh thoảng có mèo Hiếm',pate:'Hay có mèo Hiếm, đôi khi Siêu hiếm',salmon:'Có cơ hội mèo Siêu hiếm'}[k]} · tủ còn ${st.pantry[k]}</small></div><button type="button" class="btn small" data-bowl="${k}"${st.pantry[k]<3||h.bowl?' disabled':''}>Đổ 3 phần</button></div>`).join('')}</div>
    <p class="hint">Mèo hoang ngồi chơi 1-3 giờ rồi đi, để lại quà: cá, Điểm Hộp, hiếm hơn là vé hộp. Chạm vào mèo hoang để chụp ảnh. Đôi khi có con xin ở lại.</p>
    <button type="button" class="btn ghost" data-close>Đóng</button>`);
  bind($('sheet'),'[data-bowl]',el=>{const k=el.dataset.bowl;if(st.pantry[k]<3)return;st.pantry[k]-=3;const t=now();h.bowl={food:k,at:t,until:t+6*H};h.next=t+(5+R()*10)*MIN;save();closeSheet();toast('Đã đổ đồ ăn, chờ mèo hoang ghé nhé')})}
function openStray(s){sheet(`<div class="hero">${imgTag(s.g,11)}<div><span class="tag ${TIERS[tierOf(s.g)].c}">${TIERS[tierOf(s.g)].n}</span><h2>${esc(nameOf(s.g))}</h2><p class="hint">Con mèo hoang này thích nhà bạn quá, xin ở lại luôn.</p></div></div>
  <div class="acts"><button type="button" class="btn" id="adopt">Nhận nuôi</button><button type="button" class="btn ghost" data-close>Để nó đi</button></div>`);
  $('adopt').onclick=()=>{const c=mkCat({...s.g});see(c.g);home(c);st.cats.push(c);st.strays=st.strays.filter(x=>x!==s);actors.delete(s.id);save();closeSheet();syncRoom(c.id);renderRooms();toast('Mèo mới dọn vào nhà')}}

// ---------- Cửa hàng ----------
let shopTab='food';
const furnPrice=f=>Math.round(f.price*Math.pow(1.5,Math.min(4,(st.bought[f.id]||0))));
const SHOPTABS=[['food','Đồ ăn'],['toilet','Vệ sinh'],['furn','Nội thất'],['home','Nhà đất'],['market','Chợ cá']];
function renderShop(){const P=$('p-shop');const openDet=[...P.querySelectorAll('details.more')].map(d=>d.open);
  let html=`<div class="sub">${SHOPTABS.map(([k,n])=>`<button type="button" data-t="${k}" class="${shopTab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(shopTab==='food'){const room=st.pantryCap-pantryMeals();
    html+=`<p class="hint">Tủ đồ ăn ${pantryMeals()}/${st.pantryCap} phần. Mua 20 rẻ hơn 15%.</p><div class="list">${FOODS.map(f=>{const p20=Math.round(f.p*20*.85);const meal=MEALS.includes(f.id);
      return `<div class="li"><div class="ic">${FOOD_ICON[f.id]}</div><div class="tx"><b>${f.n}</b><small>+${f.mood} vui${f.fb?` · lương +${f.fb*100}%`:''} · có ${st.pantry[f.id]}</small></div>
        <button type="button" class="btn small" data-buy="${f.id}:1"${st.fish<f.p||(meal&&room<1)?' disabled':''}>${fmt(f.p)}</button>
        ${f.id!=='cake'?`<button type="button" class="btn small ghost" data-buy="${f.id}:20"${st.fish<p20||(meal&&room<20)?' disabled':''}>20: ${fmt(p20)}</button>`:''}</div>`}).join('')}</div>
      <div class="task"><div class="tx"><b>Tủ to hơn</b><small>+100 phần</small></div><button type="button" class="btn small ghost" id="cap"${st.xu<300*st.pantryCap/100?' disabled':''}>${fmt(300*st.pantryCap/100)} xu</button></div>`}
  else if(shopTab==='toilet'){const R0=curRoom();
    html+=`<p class="hint">Khay đặt vào ${ROOMT[curT()].n}. Khay xịn cho nhiều mèo hơn, bẩn chậm hơn.</p><div class="list">${TOILETS.map(f=>{const placed=!!R0.furn[f.id],owned=R0.owned.includes(f.id);const cur=f.cur==='xu'?'xu':'cá';const have=f.cur==='xu'?st.xu:st.fish;
      const btn=placed?`<button type="button" class="btn small ghost" data-a="store" data-id="${f.id}">Cất</button>`:owned?`<button type="button" class="btn small" data-a="place" data-id="${f.id}">Đặt lại</button>`:`<button type="button" class="btn small" data-a="buy" data-id="${f.id}"${have<f.price?' disabled':''}>${fmt(f.price)} ${cur}</button>`;
      return `<div class="li${placed?' on':''}"><div class="ic"><img src="care/${f.img}.webp?v=2" alt=""></div><div class="tx"><b>${f.name}</b><small>Cho ${f.cap} mèo · ${f.desc}</small></div>${btn}</div>`}).join('')}</div>
    <h3>Cát mèo</h3><div class="list">${LITTERS.map(l=>`<div class="li${st.litterUse===l.id?' on':''}"><div class="ic"><img src="care/${l.id}.webp?v=2" alt=""></div><div class="tx"><b>${l.n}</b><small>Có ${st.litter[l.id]} lần · ${l.desc}</small>
      <button type="button" class="link" data-lit="${l.id}">${st.litterUse===l.id?'Đang dùng khi dọn':'Dùng loại này khi dọn'}</button></div>
      <button type="button" class="btn small" data-lbuy="${l.id}:1"${st.fish<l.p?' disabled':''}>${fmt(l.p)}</button></div>`).join('')}</div><p class="hint">1 túi = 5 lần dọn, giá tính bằng cá.</p>`}
  else if(shopTab==='furn'){const R0=curRoom(),own=R0.owned;
    html+=`<p class="hint">Đồ cho ${ROOMT[curT()].n}, đang êm ${comfort(R0)} (cá +${comfort(R0)*10}%).</p><div class="shop">${FURN.filter(f=>!f.toilet).map(f=>{const placed=!!R0.furn[f.id],owned=own.includes(f.id);const p=furnPrice(f);
      const btn=placed?`<button type="button" class="btn small ghost" data-a="store" data-id="${f.id}">Cất</button>`:owned?`<button type="button" class="btn small" data-a="place" data-id="${f.id}">Đặt lại</button>`:`<button type="button" class="btn small" data-a="buy" data-id="${f.id}"${st.fish<p?' disabled':''}>${fmt(p)} cá</button>`;
      return `<div class="sitem${placed?' placed':''}"><div class="th"><img src="furn/${f.id}.webp?v=2" alt="${f.name}" loading="lazy"></div><div class="nm">${f.name}<small>+${f.c} êm</small></div>${btn}</div>`}).join('')}</div>`}
  else if(shopTab==='home')html+=homeHtml();
  else html+=marketHtml();
  P.innerHTML=html;
  P.querySelectorAll('details.more').forEach((d,i)=>{if(openDet[i])d.open=true});
  bind(P,'[data-t]',el=>{shopTab=el.dataset.t;render();$('panels').scrollTop=0});
  bindHome(P);
  bind(P,'[data-lit]',el=>{st.litterUse=el.dataset.lit;save();render()});
  bind(P,'[data-lbuy]',el=>{const [id,n]=el.dataset.lbuy.split(':');const l=LT[id];const cost=l.p*+n;if(st.fish<cost)return;st.fish-=cost;st.litter[id]+=l.uses*+n;save();toast(`+${l.uses*+n} lần dọn ${l.n.toLowerCase()}`);render()});
  bind(P,'[data-buy]',el=>{const [id,n]=el.dataset.buy.split(':');const f=FD[id];const cost=n==='20'?Math.round(f.p*20*.85):f.p;if(st.fish<cost)return;st.fish-=cost;st.pantry[id]+=+n;save();toast(`+${n} ${f.n}`);render()});
  if($('cap'))$('cap').onclick=e=>{const c=300*st.pantryCap/100;twoTap(e.currentTarget,'cap',`Trả ${fmt(c)} xu?`,()=>{st.xu-=c;st.pantryCap+=100;save();render()})};
  bind(P,'[data-a]',el=>{const id=el.dataset.id,f=FID[id],R0=curRoom();
    if(el.dataset.a==='buy'&&f.toilet){const xu=f.cur==='xu';if((xu?st.xu:st.fish)<f.price)return;if(xu)st.xu-=f.price;else st.fish-=f.price;R0.owned.push(id);R0.furn[id]={x:f.x,y:floorY(f),dirt:0,lit:st.litterUse};clampFurn(id,R0.furn[id]);toast(`Đã đặt ${f.name}`)}
    else if(el.dataset.a==='buy'){const p=furnPrice(f);if(st.fish<p)return;st.fish-=p;st.bought[id]=(st.bought[id]||0)+1;R0.owned.push(id);R0.furn[id]={x:f.x,y:f.wall?f.y:floorY(f)};clampFurn(id,R0.furn[id]);toast(`Đã đặt ${f.name}`)}
    else if(el.dataset.a==='place'){R0.furn[id]={x:f.x,y:f.wall?f.y:floorY(f),...(f.toilet?{dirt:(R0.tstash||{})[id]||0,lit:st.litterUse}:{})};clampFurn(id,R0.furn[id])}
    else{if(f.toilet){R0.tstash=R0.tstash||{};R0.tstash[id]=R0.furn[id].dirt||0}delete R0.furn[id]}
    save();render()})}

// ---------- Sổ mèo ----------
const TOTAL=SHAPES.length*PATTERNS.length*ALLC.length+WEIRD.length*2;
function claimable(){return TIERS.map((t,i)=>i).filter(i=>!st.claimed.includes(i)&&BY_TIER[i].every(s=>st.species.includes(s)))}
let bookTab='species';
function renderBook(){const P=$('p-book');const sp=st.species.length;
  let html=`<div class="box"><div class="row"><h3>Đã gặp ${sp}/${ALLSH.length} loài</h3><span class="hint">${st.seen.length}/${TOTAL} kiểu lông</span></div><div class="meter"><i style="width:${(sp/ALLSH.length*100).toFixed(1)}%"></i></div>
    ${claimable().map(i=>`<button type="button" class="btn small" data-claim="${i}">Đủ trang ${TIERS[i].n}: nhận ${fmt(TIERS[i].book)} xu</button>`).join('')}</div>
    <div class="sub">${[['species','Theo loài'],['recipes','Công thức trứng'],['photos','Ảnh mèo hoang']].map(([k,n])=>`<button type="button" data-t="${k}" class="${bookTab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(bookTab==='species')html+=TIERS.map((t,i)=>{const have=BY_TIER[i].filter(s=>st.species.includes(s)).length;
    return `<div class="row"><h3>${tierTag(i)} ${t.n}</h3><span class="hint">${have}/${BY_TIER[i].length}${st.claimed.includes(i)?' · đã nhận thưởng':` · đủ trang +${fmt(t.book)} xu`}</span></div>
    <div class="grid">${BY_TIER[i].map(s=>{const own=st.species.includes(s);const g={shape:s,pattern:'plain',color:'white'};const vars=st.seen.filter(k=>k.split('|')[0]===s).length;
      return `<div class="ccard${own?'':' locked'}">${own?imgTag(g):silTag(g)}<span class="nm">${own?esc(SPR[s].name):'???'}</span><em>${own?`${vars} kiểu lông${st.favKnown.includes(s)?' · thích '+FD[favOf(s)].n.toLowerCase():''}`:(i===4?'Chỉ có trong Hộp mèo':'Hộp mèo, trứng hoặc mèo hoang')}</em></div>`}).join('')}</div>`}).join('');
  if(bookTab==='recipes')html+=`<p class="hint">Ghép đúng cặp bố mẹ khi ấp trứng thì 25% nở ra mèo kỳ cục. Gợi ý dạng câu đố, có rồi mới hiện công thức.</p><div class="grid">${WEIRD.filter(w=>TIER_OF[w]<4).map(w=>{const own=st.species.includes(w);const g={shape:w,pattern:'plain',color:'white'};
      return `<div class="ccard${own?'':' locked'}">${own?imgTag(g):silTag(g)}<span class="nm">${own?esc(SPR[w].name):'???'}</span><em>${own?SPR[w].rec.map(x=>SPR[x].name).join(' + '):esc(SPR[w].hint||'')}</em></div>`}).join('')}</div>`;
  if(bookTab==='photos')html+=`<p class="hint">Chạm vào mèo hoang ghé hiên nhà để chụp ảnh. Đổ đồ ăn vào bát ngoài hiên để mời mèo ghé.</p><div class="grid">${ALLSH.map(s=>{const has=st.photos.includes(s);const g={shape:s,pattern:'plain',color:'white'};
      return has?`<div class="ccard">${imgTag(g,10)}<span class="nm">${esc(SPR[s].name)}</span></div>`:''}).join('')||'<p class="hint">Chưa có ảnh nào.</p>'}</div>`;
  html+=`<div class="box" style="margin-top:12px"><h3>Chơi lại từ đầu</h3><p class="hint">Xóa hết mèo, nhà, cá và xu trên máy này, bắt đầu lại với nhà trống. Không lấy lại được.</p><button type="button" class="btn small ghost" id="reset">Chơi lại từ đầu</button></div>`;
  P.innerHTML=html;
  $('reset').onclick=e=>twoTap(e.currentTarget,'reset','Bấm lần nữa để xóa hết',()=>{resetting=true;try{localStorage.removeItem(KEY);localStorage.removeItem(OLD);localStorage.removeItem('meo-dbg')}catch(x){}location.reload()});
  bind(P,'[data-t]',el=>{bookTab=el.dataset.t;render()});
  bind(P,'[data-claim]',el=>{const i=+el.dataset.claim;if(st.claimed.includes(i))return;st.claimed.push(i);st.xu+=TIERS[i].book;save();toast(`+${fmt(TIERS[i].book)} xu`);render()})}

// =====================================================================
// Khởi động
// =====================================================================
load();process();rebalance();
if(st.cur>=curHouse().rooms.length)st.cur=0;
resize();window.addEventListener('resize',resize);view();renderRooms();renderHud();
loadBases().then(()=>{$('loading').remove();syncRoom();render();
  if(st.pack)setTimeout(showPack,300);
  if(st.migrated){st.migrated=0;save();setTimeout(()=>toast('Game đã lên bản mới! Mèo và đồ đạc vẫn giữ nguyên. Thử mở Hộp mèo nhé',4200),700)}
  else if(!st.tut){st.tut=1;save();setTimeout(()=>{toast('Chào mừng về Nhà Mèo Méo! Nhà còn trống, mở Hộp mèo để đón những con mèo đầu tiên',4500)},700)}
  let sec=0;
  setInterval(()=>{const T=now();st.fish+=passivePerHour(T)/3600;sec++;
    if(sec%10===0){const before=st.t;process();syncRoom();renderRooms()}
    renderHud();if(sec%5===0){save();if(trayP&&!document.querySelector('.confirm')&&veil.hidden)render()}},1000);
  requestAnimationFrame(tick)})
  .catch(e=>{console.error(e);$('loading').textContent='Không tải được hình mèo. Tải lại trang thử nhé.'});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){process();syncRoom();renderRooms();render()}else save()});
// Dùng khi thử nghiệm: tua giờ
window.__meo={skip(h){dbg+=h*H;try{localStorage.setItem('meo-dbg',dbg)}catch(e){}process();syncRoom();renderRooms();render()},get st(){return st},reset(){dbg=0;try{localStorage.removeItem('meo-dbg')}catch(e){}}};
})();

</script>

</body>
</html>
